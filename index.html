    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function generateId(prefix = 'id') {
      const rand = Math.random().toString(36).slice(2, 8);
      return `${prefix}_${Date.now().toString(36)}_${rand}`;
    }

    function generateRoomCode() {
      // Excludes ambiguous chars (0, O, 1, I, L)
      const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function normalizeEmailToProfileId(email) {

          minute: '2-digit',
        });
      } catch {

    /**
     * Copies text safely inside both standard browsers and sandboxed iframes
     * using document.execCommand('copy').
     */
    function copyTextToClipboard(text) {
      if (!text) return false;
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (err) {
        console.error('Clipboard copy error:', err);
        return false;
      }
    }

    /**
     * Builds a shareable URL for the PWA. If currently inside a room, appends
     * `?room=CODE` so friends tapping the texted link jump straight into the table.
     */
    function buildShareablePwaLink(includeRoomCode = true) {
      let baseUrl = '';
      try {
        const loc = window.location;
        if (loc && (loc.protocol === 'http:' || loc.protocol === 'https:') && loc.origin && loc.origin !== 'null') {
          baseUrl = `${loc.origin}${loc.pathname}`;
        } else if (document.referrer && /^https?:\/\//i.test(document.referrer)) {
          const refUrl = new URL(document.referrer);
          baseUrl = `${refUrl.origin}${refUrl.pathname}`;
        }
      } catch {
        baseUrl = '';
      }

      if (!baseUrl) {
        return null;
      }

      if (includeRoomCode && state.currentRoomCode) {
        return `${baseUrl}?room=${encodeURIComponent(state.currentRoomCode)}`;
      }
      return baseUrl;
    }

    function handleQuickCopyAppLink(includeRoomCode = true) {
      const link = buildShareablePwaLink(includeRoomCode);
      const roomCode = includeRoomCode ? state.currentRoomCode : null;

      if (link) {
        const copied = copyTextToClipboard(link);
        if (copied) {
          showToast(
            roomCode
              ? `Invite link for Room ${roomCode} copied! Paste in a text to friends.`
              : 'Game Board link copied! Paste in a text to share.',
            'success'
          );
          return;
        }
      }

      // Fallback when previewing in an offline/srcdoc frame without an HTTP URL
      const fallbackText = roomCode
        ? `Join my Game Board room! Room code: ${roomCode}`
        : 'Game Board — Real-Time Scorekeeper PWA';
      copyTextToClipboard(fallbackText);
      showToast(
        roomCode
          ? `Copied invite text for Room ${roomCode} (will copy full PWA URL once hosted).`
          : 'Preview frame has no public URL yet—will copy your live PWA link once hosted!',
        'info'

    }

    function getAvatarObj(avatarId) {
      if (!avatarId) return AVATARS[0];
      const legacy = AVATARS.find((a) => a.id === avatarId);
      if (legacy) return legacy;
      const str = String(avatarId).trim();
      if (!str) return AVATARS[0];
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
      }
      const color = AVATAR_BG_PALETTE[Math.abs(hash) % AVATAR_BG_PALETTE.length];
      const foundMeta = state.emojiCatalog.find((item) => item.emoji === str);
      return {
        id: str,
        emoji: str,
        label: foundMeta ? foundMeta.name : 'Game Piece',
        color,
      };
    }

      const pool = state.emojiCatalog.length > 0 ? state.emojiCatalog : BUILTIN_EMOJI_CATALOG;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      return pick ? pick.emoji : '🎲';

    /**
     * Asynchronously loads the complete standard Unicode emoji set (~1,800+ emojis)
     * in the background so users can search every emoji or roll a true random piece.
     */
    async function loadFullEmojiCatalog() {
      if (state.emojiCatalogLoaded) return;
      try {
        const res = await fetch('https://cdn.jsdelivr.net/npm/unicode-emoji-json@0.6.0/data-by-emoji.json');
        if (!res.ok) return;
        const data = await res.json();
        const groupMap = {
          'Smileys & Emotion': 'Faces',
          'People & Body': 'Faces',
          'Animals & Nature': 'Animals',
          'Food & Drink': 'Food',
          'Travel & Places': 'Nature',
          'Activities': 'Games',
          'Objects': 'Objects',
          'Symbols': 'Objects',
          'Flags': 'Objects',
        };
        const seen = new Set(BUILTIN_EMOJI_CATALOG.map((item) => item.emoji));
        const merged = [...BUILTIN_EMOJI_CATALOG];
        Object.entries(data).forEach(([emoji, meta]) => {
          if (seen.has(emoji)) return;
          seen.add(emoji);
          merged.push({
            emoji,
            name: `${meta?.name || ''} ${meta?.group || ''}`.toLowerCase().trim(),
            cat: groupMap[meta?.group] || 'Objects',
          });
        });
        state.emojiCatalog = merged;
        state.emojiCatalogLoaded = true;
      } catch (err) {
        console.warn('Using built-in emoji catalog:', err?.message || err);
      }
    }

    /**
     * Safely evaluates simple calculator math expressions like "12+5*2-3"
     * (supporting standard + - * / as well as display glyphs − ×).
     */
    function evaluateScoreExpression(raw) {
      const cleaned = String(raw || '')
        .replace(/−/g, '-')
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/\s+/g, '');
      if (!cleaned) return 0;
      if (!/^[0-9+\-*/().]+$/.test(cleaned)) return NaN;
      try {
        // Safe restricted arithmetic evaluator using Function after strict regex whitelist
        const result = Function(`"use strict"; return (${cleaned});`)();
        if (typeof result !== 'number' || !Number.isFinite(result)) return NaN;
        return Math.round(result);
      } catch {
        return NaN;
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const styles = {
        info: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900',
        success: 'bg-emerald-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        error: 'bg-rose-600 text-white',
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-2xl shadow-xl font-bold text-xs sm:text-sm text-center transition-all duration-300 ${styles[type] || styles.info}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function updateConnectionBadge(status, label) {

      const colors = {

      };
      dot.className = `w-2 h-2 rounded-full ${colors[status] || colors.warn}`;
      text.textContent = label;
    }

    function applyTheme(theme) {
      state.theme = theme === 'dark' ? 'dark' : 'light';
      const htmlEl = document.documentElement;
      if (state.theme === 'dark') {
        htmlEl.classList.add('dark');
        htmlEl.classList.remove('light');
      } else {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
      }
    }

    function initTheme() {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');
    }

    function isHost(room = state.currentRoom) {
      if (!room || !state.currentUser.uid) return false;
      return room.hostUid === state.currentUser.uid;
    }

    function canCurrentUserScore(room = state.currentRoom) {
      if (!room) return false;
      if (isHost(room)) return true;
      return room.settings?.whoCanScore !== 'host';
    }

    function getRejoinableRooms() {
      const uid = state.currentUser.uid;
      const pid = state.currentUser.profileId;
      const recentSet = new Set(state.recentRoomCodes || []);

      return (state.openRooms || []).filter((r) => {
        if (!r || r.status === 'closed') return false;
        if (uid && r.hostUid === uid) return true;
        if (recentSet.has(r.code)) return true;
        return (r.players || []).some(
          (p) =>
            (uid && p.claimedByUid === uid) ||
            (pid && p.profileId && p.profileId === pid)
        );
      });
    }

    async function loadUserPreferencesFromStore() {
      if (isLocalFallback) {
        if (localStore.userPrefs) {
          applyLoadedPrefs(localStore.userPrefs);
        }
        return;
      }
      if (!fbUser) return;
      try {
        const snap = await getDoc(getUserPrefsDoc(fbUser.uid));
        if (snap.exists()) {
          applyLoadedPrefs(snap.data());
        }
      } catch (err) {
        console.warn('Could not load user preferences:', err?.message || err);
      }
    }

    function applyLoadedPrefs(prefs) {
      if (!prefs) return;
      if (prefs.theme === 'dark' || prefs.theme === 'light') {
        applyTheme(prefs.theme);
      }
      if (prefs.name) state.currentUser.name = prefs.name;
      if (prefs.email) state.currentUser.email = prefs.email;
      if (prefs.profileId) state.currentUser.profileId = prefs.profileId;
      if (prefs.avatar) state.currentUser.avatar = getAvatarObj(prefs.avatar).emoji;
      if (typeof prefs.isGuest === 'boolean') state.currentUser.isGuest = prefs.isGuest;
      if (Array.isArray(prefs.favorites)) state.currentUser.favorites = prefs.favorites;
      if (Array.isArray(prefs.recentRoomCodes)) state.recentRoomCodes = prefs.recentRoomCodes;
    }

    async function persistUserPreferences() {
      const payload = {
        theme: state.theme,
        name: state.currentUser.name || '',
        email: state.currentUser.email || '',
        profileId: state.currentUser.profileId || null,
        avatar: state.currentUser.avatar || '♟️',
        isGuest: Boolean(state.currentUser.isGuest),
        favorites: state.currentUser.favorites || [],
        recentRoomCodes: state.recentRoomCodes || [],
        updatedAt: Date.now(),
      };
      if (isLocalFallback) {
        localStore.userPrefs = payload;
        return;
      }
      if (!fbUser) return;
      try {
        await setDoc(getUserPrefsDoc(fbUser.uid), payload, { merge: true });
      } catch (err) {
        console.warn('Could not persist user preferences:', err?.message || err);
      }
    }

    function rememberRoomCode(code) {
      const clean = String(code || '').replace(/\s+/g, '').toUpperCase();
      if (!clean) return;
      state.recentRoomCodes = [clean, ...state.recentRoomCodes.filter((c) => c !== clean)].slice(0, 12);
      persistUserPreferences();
    }

    function forgetRoomCode(code) {
      const clean = String(code || '').replace(/\s+/g, '').toUpperCase();
      state.recentRoomCodes = state.recentRoomCodes.filter((c) => c !== clean);
      persistUserPreferences();
    }

    async function initFirebase() {
      try {
        let firebaseConfig = CUSTOM_FIREBASE_CONFIG;
        if (!firebaseConfig && typeof __firebase_config !== 'undefined' && __firebase_config) {
          firebaseConfig = typeof __firebase_config === 'string'
            ? JSON.parse(__firebase_config)
            : __firebase_config;
        }

        if (!firebaseConfig || !firebaseConfig.apiKey) {
          isLocalFallback = true;
          state.currentUser.uid = generateId('local_u');
          updateConnectionBadge('local', 'Local Session Mode');
          render();
          handlePendingInviteParam();
          return;
        }

        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // Authenticate BEFORE any Firestore queries.
        // Use Anonymous Auth when connected to a custom Firebase project so Canvas tokens don't conflict.
        if (!CUSTOM_FIREBASE_CONFIG && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        fbUser = auth.currentUser;
        if (!fbUser) {
          await new Promise((resolve) => {
            const unsub = onAuthStateChanged(auth, (u) => {
              if (u) {
                fbUser = u;
                unsub();
                resolve();
              }
            });
          });
        }

        state.currentUser.uid = fbUser.uid;
        updateConnectionBadge('ok', 'Live Sync Ready');

        await loadUserPreferencesFromStore();
        subscribeOpenRooms();
        subscribeMatchHistory();
        subscribeSavedMatches();
        render();
        handlePendingInviteParam();
      } catch (err) {
        console.error('Firebase initialization failed, falling back to local session:', err);
        isLocalFallback = true;
        state.currentUser.uid = state.currentUser.uid || generateId('local_u');
        if (err?.code === 'auth/operation-not-allowed' || err?.code === 'auth/admin-restricted-operation') {
          updateConnectionBadge('warn', 'Enable Anonymous Auth');
          showToast('Enable Anonymous Sign-In in Firebase Console → Authentication to sync live.', 'warning');
        } else {
          updateConnectionBadge('warn', 'Offline Session Mode');
        }
        render();
      }
    }

    function subscribeOpenRooms() {
      if (isLocalFallback || !fbUser) return;
      if (state.openRoomsUnsubscribe) state.openRoomsUnsubscribe();

      state.openRoomsUnsubscribe = onSnapshot(
        getRoomsCol(),
        (snap) => {
          const list = [];
          snap.forEach((docSnap) => {
            const d = docSnap.data();
            if (d && d.status !== 'closed') {
              list.push(d);
            }
          });
          list.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
          state.openRooms = list;
          if (state.view === 'landing') {
            render();
          }
        },
        (err) => {
          console.error('Error listening to rooms:', err);
          if (err?.code === 'permission-denied') {
            updateConnectionBadge('warn', 'Preview Auth Required');
          }
        }
      );
    }

    function subscribeMatchHistory() {
      if (isLocalFallback || !fbUser) return;
      if (state.historyUnsubscribe) state.historyUnsubscribe();

      state.historyUnsubscribe = onSnapshot(
        getMatchesCol(),
        (snap) => {
          const list = [];
          snap.forEach((docSnap) => {
            const d = docSnap.data();
            if (d) list.push(d);
          });
          list.sort((a, b) => (b.finishedAt || b.createdAt || 0) - (a.finishedAt || a.createdAt || 0));
          state.matchHistory = list;
        },
        (err) => {
          console.error('Error listening to match history:', err);
        }
      );
    }

    function subscribeSavedMatches() {
      if (isLocalFallback || !fbUser) return;
      if (state.savedMatchesUnsubscribe) state.savedMatchesUnsubscribe();

      state.savedMatchesUnsubscribe = onSnapshot(
        getSavedMatchesCol(),
        (snap) => {
          const list = [];
          snap.forEach((docSnap) => {
            const d = docSnap.data();
            if (d) list.push(d);
          });
          list.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
          state.savedMatches = list;
          if (state.view === 'lobby') {
            render();
          }
        },
        (err) => {
          console.error('Error listening to saved matches:', err);
        }
      );
    }

    function subscribeRoom(roomCode) {
      if (state.roomUnsubscribe) {
        state.roomUnsubscribe();
        state.roomUnsubscribe = null;
      }

      const cleanCode = String(roomCode || '').replace(/\s+/g, '').toUpperCase();
      state.currentRoomCode = cleanCode;
      rememberRoomCode(cleanCode);

      if (isLocalFallback) {
        const localRoom = localStore.rooms[cleanCode];
        if (!localRoom || localRoom.status === 'closed') {
          leaveRoomLocal();
          return;
        }
        state.currentRoom = JSON.parse(JSON.stringify(localRoom));
        state.view = state.currentRoom.activeMatch ? 'match' : 'lobby';
        render();
        return;
      }

      if (!fbUser) return;

      state.roomUnsubscribe = onSnapshot(
        getRoomDoc(cleanCode),
        (docSnap) => {
          if (!docSnap.exists()) {
            forgetRoomCode(cleanCode);
            showToast('This room no longer exists.', 'warning');
            leaveRoomLocal();
            return;
          }
          const data = docSnap.data();
          if (data.status === 'closed') {
            forgetRoomCode(cleanCode);
            showToast(`Room ${cleanCode} was closed by the host.`, 'info');
            leaveRoomLocal();
            return;
          }
          state.currentRoom = data;
          state.view = data.activeMatch ? 'match' : 'lobby';
          render();
        },
        (err) => {
          console.error('Room listener error:', err);
          showToast('Lost connection to room. Reconnecting...', 'error');
        }
      );
    }

    function leaveRoomLocal() {
      if (state.roomUnsubscribe) {
        state.roomUnsubscribe();
        state.roomUnsubscribe = null;
      }
      state.currentRoomCode = null;
      state.currentRoom = null;
      state.view = 'landing';
      render();
    }

    // =========================================================================
    // 6. DATA LAYER (Room, Profile, History & Saved Match CRUD)
    // =========================================================================
    async function fetchRoom(code) {
      const clean = String(code || '').replace(/\s+/g, '').toUpperCase();
      if (!clean) return null;
      if (isLocalFallback) {
        const r = localStore.rooms[clean];
        return r && r.status !== 'closed' ? JSON.parse(JSON.stringify(r)) : null;
      }
      if (!fbUser) return null;
      const snap = await getDoc(getRoomDoc(clean));
      if (!snap.exists()) return null;
      const data = snap.data();
      return data && data.status !== 'closed' ? data : null;
    }

    async function saveRoom(roomObj) {
      const payload = {
        ...roomObj,
        updatedAt: Date.now(),
      };
      if (isLocalFallback) {
        localStore.rooms[payload.code] = JSON.parse(JSON.stringify(payload));
        if (state.currentRoomCode === payload.code) {
          state.currentRoom = JSON.parse(JSON.stringify(payload));
          state.view = payload.activeMatch ? 'match' : 'lobby';
        }
        state.openRooms = Object.values(localStore.rooms).filter((r) => r.status !== 'closed');
        render();
        return;
      }
      if (!fbUser) return;
      await setDoc(getRoomDoc(payload.code), payload);
    }

    async function fetchProfileById(profileId) {
      if (!profileId) return null;
      if (isLocalFallback) {
        return localStore.profiles[profileId] || null;
      }
      if (!fbUser) return null;
      try {
        const snap = await getDoc(getProfileDoc(profileId));
        return snap.exists() ? snap.data() : null;
      } catch (err) {
        console.warn('Error reading profile:', err);
        return null;
      }
    }

    async function saveUserProfile(profile) {
      if (!profile || !profile.profileId) return;
      const payload = { ...profile, updatedAt: Date.now() };
      if (isLocalFallback) {
        localStore.profiles[profile.profileId] = payload;
        return;
      }
      if (!fbUser) return;
      await setDoc(getProfileDoc(profile.profileId), payload, { merge: true });
    }

    async function saveMatchRecord(record) {
      if (isLocalFallback) {
        localStore.matches[record.matchId] = record;
        state.matchHistory = Object.values(localStore.matches).sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
        return;
      }
      if (!fbUser) return;
      await setDoc(getMatchDoc(record.matchId), record);
    }

    async function savePausedMatchRecord(savedObj) {
      if (isLocalFallback) {
        localStore.savedMatches[savedObj.savedId] = JSON.parse(JSON.stringify(savedObj));
        state.savedMatches = Object.values(localStore.savedMatches).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
        return;
      }
      if (!fbUser) return;
      await setDoc(getSavedMatchDoc(savedObj.savedId), savedObj);
    }

    async function deleteSavedMatchRecord(savedId) {
      if (!savedId) return;
      if (isLocalFallback) {
        delete localStore.savedMatches[savedId];
        state.savedMatches = Object.values(localStore.savedMatches).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
        render();
        return;
      }
      if (!fbUser) return;
      await deleteDoc(getSavedMatchDoc(savedId));
    }

    function getSavedMatchesForCurrentRoom() {
      const room = state.currentRoom;
      if (!room) return [];
      return (state.savedMatches || []).filter(
        (m) => m.roomCode === room.code || (m.hostUid && m.hostUid === room.hostUid)
      );
    }

    // =========================================================================
    // 7. SCORING & MATCH LIFECYCLE LOGIC
    // =========================================================================
    function computePlayerTotals(room) {
      const totals = {};
      if (!room) return totals;
      (room.players || []).forEach((p) => {
        totals[p.seatId] = 0;
      });
      const rounds = room.activeMatch?.rounds || [];
      rounds.forEach((r) => {
        Object.entries(r.scores || {}).forEach(([seatId, pts]) => {
          if (pts === null || pts === undefined) return;
          const val = Number(pts) || 0;
          totals[seatId] = (totals[seatId] || 0) + val;
        });
      });
      return totals;
    }

    function computeStandings(room) {
      const totals = computePlayerTotals(room);
      return (room.players || [])
        .map((p) => ({ ...p, total: totals[p.seatId] || 0 }))
        .sort((a, b) => b.total - a.total);
    }

    async function startNewMatchInRoom(game, rulesObj) {
      if (!state.currentRoom) return;
      const updated = JSON.parse(JSON.stringify(state.currentRoom));
      updated.status = 'playing';
      updated.activeMatch = {
        matchId: generateId('match'),
        gameId: game.id,
        gameName: game.name,
        rules: { ...game.defaultRules, ...(rulesObj || {}) },
        rounds: [],
        startedAt: Date.now(),
        finishedAt: null,
        winnerSeatIds: [],
      };
      await saveRoom(updated);
      showToast(`Started ${game.name}!`, 'success');
    }

    async function finalizeMatch(roomObj) {
      const standings = computeStandings(roomObj);
      const topScore = standings.length > 0 ? standings[0].total : 0;
      const winners = standings.filter((p) => p.total === topScore);
      const winnerSeatIds = winners.map((w) => w.seatId);

      roomObj.status = 'finished';
      roomObj.activeMatch.finishedAt = Date.now();
      roomObj.activeMatch.winnerSeatIds = winnerSeatIds;

      // Save match history record for room participants
      const participantUids = [...new Set([
        roomObj.hostUid,
        ...(roomObj.players || []).map((p) => p.claimedByUid).filter(Boolean),
      ])];
      const participantProfileIds = [...new Set(
        (roomObj.players || []).map((p) => p.profileId).filter(Boolean)
      )];

      const historyRecord = {
        matchId: roomObj.activeMatch.matchId || generateId('match'),
        roomCode: roomObj.code,
        gameId: roomObj.activeMatch.gameId,
        gameName: roomObj.activeMatch.gameName,
        hostUid: roomObj.hostUid,
        participantUids,
        participantProfileIds,
        standings: standings.map((s) => ({
          seatId: s.seatId,
          name: s.name,
          avatar: s.avatar,
          total: s.total,
        })),
        winnerNames: winners.map((w) => w.name),
        roundCount: (roomObj.activeMatch.rounds || []).length,
        finishedAt: roomObj.activeMatch.finishedAt,
      };

      await saveMatchRecord(historyRecord);
      await saveRoom(roomObj);

      const winLabel = winners.map((w) => w.name).join(' & ');
      showToast(`🏆 ${winLabel} won ${roomObj.activeMatch.gameName}!`, 'success');
    }

    async function saveActiveGameForLater() {
      const room = state.currentRoom;
      if (!room || !room.activeMatch) return;

      const totals = computePlayerTotals(room);
      const savedObj = {
        savedId: generateId('saved'),
        roomCode: room.code,
        hostUid: room.hostUid,
        gameId: room.activeMatch.gameId,
        gameName: room.activeMatch.gameName,
        match: JSON.parse(JSON.stringify(room.activeMatch)),
        playersSnapshot: (room.players || []).map((p) => ({
          ...p,
          total: totals[p.seatId] || 0,
        })),
        savedAt: Date.now(),
      };

      await savePausedMatchRecord(savedObj);

      const updated = JSON.parse(JSON.stringify(room));
      updated.status = 'lobby';
      updated.activeMatch = null;
      await saveRoom(updated);
      showToast(`${savedObj.gameName} saved for later! Resume anytime from the lobby.`, 'success');
    }

    async function resumeSavedMatch(savedObj) {
      const room = state.currentRoom;
      if (!room || !savedObj) return;
      const updated = JSON.parse(JSON.stringify(room));

      // Merge any missing seats from the saved match back into the room so scores stay intact
      const existingSeatIds = new Set((updated.players || []).map((p) => p.seatId));
      (savedObj.playersSnapshot || []).forEach((sp) => {
        if (!existingSeatIds.has(sp.seatId)) {
          updated.players.push({
            seatId: sp.seatId,
            name: sp.name,
            avatar: sp.avatar,
            claimedByUid: sp.claimedByUid || null,
            profileId: sp.profileId || null,
          });
        }
      });

      updated.status = 'playing';
      updated.activeMatch = JSON.parse(JSON.stringify(savedObj.match));
      await saveRoom(updated);
      await deleteSavedMatchRecord(savedObj.savedId);
      showToast(`Resumed ${savedObj.gameName}!`, 'success');
    }

    async function discardActiveGame() {
      const room = state.currentRoom;
      if (!room) return;
      const name = room.activeMatch?.gameName || 'Game';
      const updated = JSON.parse(JSON.stringify(room));
      updated.status = 'lobby';
      updated.activeMatch = null;
      await saveRoom(updated);
      showToast(`${name} discarded.`, 'info');
    }

    async function closeCurrentRoom({ saveActiveFirst = false } = {}) {
      const room = state.currentRoom;
      if (!room) return;

      if (saveActiveFirst && room.activeMatch && room.status === 'playing') {
        const totals = computePlayerTotals(room);
        await savePausedMatchRecord({
          savedId: generateId('saved'),
          roomCode: room.code,
          hostUid: room.hostUid,
          gameId: room.activeMatch.gameId,
          gameName: room.activeMatch.gameName,
          match: JSON.parse(JSON.stringify(room.activeMatch)),
          playersSnapshot: (room.players || []).map((p) => ({
            ...p,
            total: totals[p.seatId] || 0,
          })),
          savedAt: Date.now(),
        });
      }

      const updated = JSON.parse(JSON.stringify(room));
      updated.status = 'closed';
      updated.activeMatch = null;
      updated.closedAt = Date.now();
      await saveRoom(updated);
      forgetRoomCode(room.code);
      showToast(
        saveActiveFirst
          ? `Game saved & Room ${room.code} closed.`
          : `Room ${room.code} closed.`,
        'info'
      );
      leaveRoomLocal();
    }

    async function toggleFavoriteGame(gameId) {
      const favs = new Set(state.currentUser.favorites || []);
      if (favs.has(gameId)) {
        favs.delete(gameId);
      } else {
        favs.add(gameId);
      }
      state.currentUser.favorites = Array.from(favs);
      await persistUserPreferences();

      if (state.currentUser.profileId) {
        await saveUserProfile({
          profileId: state.currentUser.profileId,
          name: state.currentUser.name,
          email: state.currentUser.email,
          avatar: state.currentUser.avatar,
          favorites: state.currentUser.favorites,
        });
      }
      render();
    }

            (state.currentUser.uid && p.claimedByUid === state.currentUser.uid) ||
            (state.currentUser.profileId && p.profileId && p.profileId === state.currentUser.profileId)

                <div class="text-[10px] font-bold uppercase tracking-widest opacity-80">Code</div>
                <div class="text-xl font-black tracking-[0.2em] leading-none mt-0.5">${escapeHtml(room.code)}</div>
              </div>
              <div class="min-w-0">
                <h1 class="text-lg font-extrabold text-slate-900 dark:text-white truncate">Game Room Lobby</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">
                  Share the invite link or 4-letter code so friends can join on their phones.
                </p>
              </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap shrink-0">
              <button id="lobby-copy-link-btn" class="px-3.5 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-sm active:scale-95 transition flex items-center gap-1.5">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                <span>Copy Invite Link</span>
              </button>
              <button id="lobby-settings-btn" class="px-3.5 py-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-xs transition">
                ⚙️ Settings
              </button>
              ${host ? `
                <button id="lobby-close-room-btn" class="px-3.5 py-2.5 rounded-2xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800/80 hover:bg-rose-100 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-400 font-bold text-xs transition">
                  Close Room
                </button>
              ` : `
                <button id="lobby-leave-room-btn" class="px-3.5 py-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold text-xs transition">
                  Leave
                </button>
              `}
            </div>
          </section>

          <!-- Seated Players Panel -->
          <section class="p-4 sm:p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div>
                <h2 class="text-sm font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Seated Players (${players.length})
                </h2>
                <p class="text-xs text-slate-400 dark:text-slate-500">
                  ${host ? 'Add extra seats for people without phones—they can claim their seat later if they join.' : 'Waiting for the host to pick a game.'}
                </p>
              </div>
              ${host ? `
                <button id="lobby-add-seat-btn" class="px-3.5 py-2 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-300 font-bold text-xs transition">
                  ＋ Add Seat
                </button>
              ` : ''}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
              ${players.map((p) => {
                const av = getAvatarObj(p.avatar);
                const isRoomHost = p.claimedByUid && p.claimedByUid === room.hostUid;
                const isMe = p.claimedByUid && p.claimedByUid === state.currentUser.uid;
                const isClaimed = Boolean(p.claimedByUid);
                return `
                  <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border ${isMe ? 'border-indigo-400 dark:border-indigo-500' : 'border-slate-200/80 dark:border-slate-700/80'} flex items-center justify-between gap-2.5">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <span class="w-10 h-10 rounded-xl flex items-center justify-center text-xl shrink-0 ${av.color}">${av.emoji}</span>
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                          <span class="font-bold text-sm text-slate-900 dark:text-white truncate">${escapeHtml(p.name)}</span>
                          ${isMe ? '<span class="text-[10px] font-bold text-indigo-600 dark:text-indigo-400">(You)</span>' : ''}
                        </div>
                        <div class="flex items-center gap-1.5 mt-0.5 flex-wrap">
                          ${isRoomHost ? '<span class="px-1.5 py-0.5 rounded-md bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-200 text-[10px] font-bold">HOST</span>' : ''}
                          <span class="text-[11px] font-medium ${isClaimed ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'}">
                            ${isClaimed ? '● Connected' : '○ Open Seat'}
                          </span>
                        </div>
                      </div>
                    </div>
                    ${host && !isRoomHost ? `
                      <button data-remove-seat="${escapeHtml(p.seatId)}" title="Remove Seat" class="remove-seat-btn w-8 h-8 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/60 flex items-center justify-center text-xs font-bold transition shrink-0">
                        ✕
                      </button>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <!-- Saved Games (Resume Later) -->
          ${savedList.length > 0 ? `
            <section class="p-4 sm:p-5 rounded-3xl bg-amber-50/70 dark:bg-amber-950/25 border border-amber-200/90 dark:border-amber-800/70 space-y-3">
              <div class="flex items-center justify-between">
                <div>
                  <h2 class="text-sm font-extrabold uppercase tracking-wider text-amber-800 dark:text-amber-300">
                    💾 Saved Games (${savedList.length})
                  </h2>
                  <p class="text-xs text-amber-700/80 dark:text-amber-300/70">Pick up right where you left off</p>
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${savedList.map((sm) => `
                  <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-amber-200/80 dark:border-amber-800/60 flex flex-col justify-between gap-3">
                    <div class="space-y-1">
                      <div class="flex items-center justify-between gap-2">
                        <span class="font-extrabold text-sm text-slate-900 dark:text-white">${escapeHtml(sm.gameName)}</span>
                        <span class="text-[11px] font-semibold text-slate-400">${formatShortDate(sm.savedAt)}</span>
                      </div>
                      <div class="text-xs text-slate-500 dark:text-slate-400">
                        ${(sm.match?.rounds || []).length} rounds · ${(sm.playersSnapshot || []).map((p) => `${escapeHtml(p.name)}: ${p.total}`).join(', ')}
                      </div>
                    </div>
                    ${host ? `
                      <div class="flex items-center gap-2">
                        <button data-resume-saved="${escapeHtml(sm.savedId)}" class="resume-saved-btn flex-1 py-2 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs transition">
                          Resume Game →
                        </button>
                        <button data-discard-saved="${escapeHtml(sm.savedId)}" class="discard-saved-btn py-2 px-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 hover:bg-rose-100 text-rose-600 dark:text-rose-400 font-bold text-xs transition">
                          Discard
                        </button>
                      </div>
                    ` : `
                      <div class="text-[11px] font-semibold text-slate-400">Only the host can resume saved games.</div>
                    `}
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          <!-- Game Selection Library -->
          <section class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h2 class="text-lg font-extrabold text-slate-900 dark:text-white">Choose a Game</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">
                  Tap any game to start a match, view editable rules, or browse table history.
                </p>
              </div>
              <div class="relative w-full sm:w-64">
                <input
                  id="lobby-game-search"
                  type="text"
                  value="${escapeHtml(state.searchQuery)}"
                  placeholder="Search games..."
                  class="w-full pl-9 pr-4 py-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </div>
            </div>

            <!-- Favorites Shelf -->
            ${favoriteGames.length > 0 ? `
              <div class="space-y-2.5">
                <div class="text-xs font-extrabold uppercase tracking-wider text-amber-600 dark:text-amber-400">★ Favorites</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  ${favoriteGames.map(renderGameCard).join('')}
                </div>
              </div>
            ` : ''}

            <!-- All Games Grid -->
            <div class="space-y-2.5">
              ${favoriteGames.length > 0 ? '<div class="text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">All Games</div>' : ''}
              ${filteredGames.length === 0 ? `
                <div class="p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center text-sm text-slate-400">
                  No games matched "${escapeHtml(state.searchQuery)}".
                </div>
              ` : `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  ${filteredGames.map(renderGameCard).join('')}
                </div>
              `}
            </div>
          </section>
        </div>
      `;

      // Lobby Event Bindings
      document.getElementById('lobby-copy-link-btn').addEventListener('click', () => {
        handleQuickCopyAppLink(true);
      });

      document.getElementById('lobby-settings-btn').addEventListener('click', () => {
        openRoomSettingsModal();
      });

      const closeRoomBtn = document.getElementById('lobby-close-room-btn');
      if (closeRoomBtn) {
        closeRoomBtn.addEventListener('click', () => openCloseRoomConfirmModal());
      }

      const leaveRoomBtn = document.getElementById('lobby-leave-room-btn');
      if (leaveRoomBtn) {
        leaveRoomBtn.addEventListener('click', () => {
          showToast(`Left room ${room.code}.`, 'info');
          leaveRoomLocal();
        });
      }

      const addSeatBtn = document.getElementById('lobby-add-seat-btn');
      if (addSeatBtn) {
        addSeatBtn.addEventListener('click', () => openAddSeatModal());
      }

      container.querySelectorAll('.remove-seat-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const sid = btn.getAttribute('data-remove-seat');
          const updated = JSON.parse(JSON.stringify(state.currentRoom));
          updated.players = (updated.players || []).filter((p) => p.seatId !== sid);
          await saveRoom(updated);
          showToast('Seat removed.', 'info');
        });
      });

      container.querySelectorAll('.resume-saved-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const sid = btn.getAttribute('data-resume-saved');
          const target = savedList.find((x) => x.savedId === sid);
          if (target) await resumeSavedMatch(target);
        });
      });

      container.querySelectorAll('.discard-saved-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const sid = btn.getAttribute('data-discard-saved');
          const target = savedList.find((x) => x.savedId === sid);
          if (target) {
            openTwoStepDiscardConfirmModal({
              title: `Discard Saved ${target.gameName}?`,
              subtitle: `This permanently deletes the ${(target.match?.rounds || []).length} logged rounds saved on ${formatShortDate(target.savedAt)}.`,
              onConfirm: async () => {
                await deleteSavedMatchRecord(target.savedId);
                showToast(`Saved ${target.gameName} discarded.`, 'info');
              },
            });
          }
        });
      });

      const searchInp = document.getElementById('lobby-game-search');
      if (searchInp) {
        searchInp.addEventListener('input', (e) => {
          const pos = e.target.selectionStart;
          state.searchQuery = e.target.value;
          render();
          const newInp = document.getElementById('lobby-game-search');
          if (newInp) {
            newInp.focus();
            newInp.setSelectionRange(pos, pos);
          }
        });
      }

      container.querySelectorAll('.open-game-card-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const gid = btn.getAttribute('data-open-game');
          const game = GAME_CATALOG.find((g) => g.id === gid);
          if (game) openGameDetailModal(game);
        });
      });

      container.querySelectorAll('.toggle-fav-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const gid = btn.getAttribute('data-fav-game');
          if (gid) toggleFavoriteGame(gid);
        });
      });
    }

    // =========================================================================
    // 9C. VIEW: ACTIVE / FINISHED MATCH SCOREBOARD
    // =========================================================================
    function renderMatchView(container) {
      const room = state.currentRoom;
      const match = room.activeMatch;
      const game = GAME_CATALOG.find((g) => g.id === match.gameId);
      const host = isHost(room);
      const canScore = canCurrentUserScore(room);
      const isFinished = room.status === 'finished';
      const isGin = match.gameId === 'gin-rummy';
      const isScrabble = match.gameId === 'scrabble';

      const players = room.players || [];
      const rounds = match.rounds || [];
      const standings = computeStandings(room);
      const lastRound = rounds.length > 0 ? rounds[rounds.length - 1] : null;
      const targetScore = isGin ? (match.rules?.targetScore || 100) : null;
      const winnerSet = new Set(match.winnerSeatIds || []);

      // Collaborative round progress detection
      const mySeat = players.find((p) => p.claimedByUid && p.claimedByUid === state.currentUser.uid) || null;
      const lastStandardRound = lastRound && lastRound.type === 'standard' ? lastRound : null;
      const lastRoundNumber = rounds.length;
      const pendingSeatsOnLastRound = lastStandardRound
        ? players.filter((p) => lastStandardRound.scores?.[p.seatId] === null || lastStandardRound.scores?.[p.seatId] === undefined)
        : [];
      const currentUserPendingLastRound = Boolean(
        !isFinished &&
        lastStandardRound &&
        mySeat &&
        (lastStandardRound.scores?.[mySeat.seatId] === null || lastStandardRound.scores?.[mySeat.seatId] === undefined)
      );
      const displayRoundNum = lastStandardRound && pendingSeatsOnLastRound.length > 0 ? lastRoundNumber : rounds.length + 1;

      const ruleBadgeText = isGin
        ? `Playing to ${targetScore} pts`
        : match.rules?.doubleTileTransfer
          ? 'No cap · 2× OUT Tile Transfer'
          : 'No cap · Tap OUT when tiles run out';

      const winnerNames = standings.filter((s) => winnerSet.has(s.seatId)).map((s) => s.name);

      container.innerHTML = `
        <div class="space-y-5">
          <!-- Match Header -->
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">${escapeHtml(match.gameName)}</h1>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${
                  isFinished
                    ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300'
                    : 'bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300'
                }">
                  ${isFinished ? 'Finished' : `Round ${displayRoundNum}`}
                </span>
              </div>
              <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mt-0.5">${escapeHtml(ruleBadgeText)}</p>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
              <button id="match-rules-btn" class="px-3.5 py-2 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-slate-300 text-xs font-bold transition">
                Rules
              </button>
              ${host && !isFinished ? `
                <button id="match-edit-rules-btn" class="px-3.5 py-2 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-slate-300 text-xs font-bold transition">
                  Edit Rules
                </button>
                <button id="match-close-game-btn" class="px-3.5 py-2 rounded-2xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800/80 hover:bg-rose-100 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-400 text-xs font-bold transition">
                  Close Game
                </button>
              ` : ''}
              ${host && isFinished ? `
                <button id="match-back-lobby-btn" class="px-3.5 py-2 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold transition">
                  ← Lobby
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Winner Banner (when finished) -->
          ${isFinished ? `
            <div class="p-5 sm:p-6 rounded-3xl bg-gradient-to-br from-amber-400 via-orange-500 to-rose-500 text-white shadow-soft flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div class="space-y-1">
                <div class="text-xs font-extrabold uppercase tracking-widest opacity-90">🏆 Match Complete</div>
                <div class="text-2xl font-black">${escapeHtml(winnerNames.join(' & ') || 'Winner')} Wins!</div>
                <p class="text-xs sm:text-sm text-amber-50">Final results have been saved to your table’s match history.</p>
              </div>
              ${host ? `
                <div class="flex items-center gap-2 shrink-0">
                  <button id="match-play-again-btn" class="px-4 py-2.5 rounded-2xl bg-white text-slate-900 hover:bg-amber-50 font-extrabold text-xs shadow-sm transition">
                    Play Again
                  </button>
                  <button id="match-lobby-after-win-btn" class="px-4 py-2.5 rounded-2xl bg-black/20 hover:bg-black/30 text-white font-bold text-xs transition">
                    Choose New Game
                  </button>
                </div>
              ` : ''}
            </div>
          ` : ''}

          <!-- Live Standings Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            ${standings.map((p, idx) => {
              const av = getAvatarObj(p.avatar);
              const isWinner = isFinished && winnerSet.has(p.seatId);
              const isLeader = !isFinished && idx === 0 && p.total > 0;
              const rawLast = lastRound ? lastRound.scores?.[p.seatId] : undefined;
              const isPendingLast = !isFinished && Boolean(lastStandardRound) && (rawLast === null || rawLast === undefined);
              const lastDelta = rawLast !== null && rawLast !== undefined ? Number(rawLast) : null;
              const pct = targetScore ? Math.min(100, Math.max(0, Math.round((p.total / targetScore) * 100))) : null;

              return `
                <div class="p-4 rounded-3xl bg-white dark:bg-slate-900 border-2 ${
                  isWinner
                    ? 'border-amber-400 shadow-soft'
                    : isLeader
                      ? 'border-indigo-400 dark:border-indigo-500 shadow-sm'
                      : 'border-slate-200 dark:border-slate-800'
                } space-y-3">
                  <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <span class="w-9 h-9 rounded-xl flex items-center justify-center text-lg shrink-0 ${av.color}">${av.emoji}</span>
                      <div class="min-w-0">
                        <div class="font-extrabold text-sm text-slate-900 dark:text-white truncate">${escapeHtml(p.name)}</div>
                        <div class="text-[11px] font-semibold text-slate-400">
                          ${isWinner ? '🏆 Winner' : `#${idx + 1} Place`}
                        </div>
                      </div>
                    </div>
                    ${isPendingLast ? `
                      <span class="px-2 py-0.5 rounded-lg text-[11px] font-bold bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300">
                        Rnd ${lastRoundNumber} Pending
                      </span>
                    ` : lastDelta !== null && lastDelta !== 0 ? `
                      <span class="px-2 py-0.5 rounded-lg text-xs font-extrabold tabular-nums ${
                        lastDelta > 0
                          ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300'
                          : 'bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400'
                      }">
                        ${lastDelta > 0 ? `+${lastDelta}` : lastDelta}
                      </span>
                    ` : ''}
                  </div>

                  <div class="flex items-baseline justify-between">
                    <div class="text-3xl font-extrabold tabular-nums text-slate-900 dark:text-white">${p.total}</div>
                    ${targetScore ? `<span class="text-xs font-semibold text-slate-400">/ ${targetScore}</span>` : '<span class="text-xs font-semibold text-slate-400">pts</span>'}
                  </div>

                  ${pct !== null ? `
                    <div class="w-full h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                      <div class="h-full rounded-full transition-all duration-300 ${isWinner ? 'bg-amber-400' : 'bg-indigo-600 dark:bg-indigo-400'}" style="width: ${pct}%"></div>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>

          <!-- Primary Action Controls (when playing) -->
          ${!isFinished ? `
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5">
              ${canScore ? `
                ${currentUserPendingLastRound ? `
                  <button id="match-log-my-pending-btn" class="flex-1 py-4 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-extrabold text-sm sm:text-base shadow-soft transition flex items-center justify-center gap-2">
                    <span>＋ Log Your Round ${lastRoundNumber} Score</span>
                  </button>
                  <button id="match-log-round-btn" class="py-4 px-5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold text-sm transition flex items-center justify-center gap-2">
                    <span>Start Round ${rounds.length + 1}</span>
                  </button>
                ` : `
                  <button id="match-log-round-btn" class="flex-1 py-4 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-extrabold text-sm sm:text-base shadow-soft transition flex items-center justify-center gap-2">
                    <span>＋ Log Round ${rounds.length + 1}</span>
                  </button>
                  ${pendingSeatsOnLastRound.length > 0 ? `
                    <button id="match-fill-pending-btn" class="py-4 px-5 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 font-bold text-sm transition flex items-center justify-center gap-1.5">
                      <span>✎ Fill Round ${lastRoundNumber} (${pendingSeatsOnLastRound.length} pending)</span>
                    </button>
                  ` : ''}
                `}
                ${isScrabble ? `
                  <button id="match-scrabble-out-btn" class="py-4 px-5 rounded-2xl bg-amber-500 hover:bg-amber-400 active:scale-[0.99] text-slate-950 font-extrabold text-sm sm:text-base shadow-sm transition flex items-center justify-center gap-2">
                    <span>🏁 OUT (End Game)</span>
                  </button>
                ` : ''}

    function buildNumberPadHtml({ nextLabel = 'Next ↵', allowMathOps = true } = {}) {
      const btnBase = 'h-12 sm:h-13 rounded-2xl font-extrabold text-lg select-none active:scale-95 transition flex items-center justify-center';
      const digitBtn = `${btnBase} bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-700 shadow-sm`;
      const opBtn = `${btnBase} bg-indigo-50 dark:bg-indigo-950/70 border border-indigo-200/80 dark:border-indigo-800/80 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-900/70`;
      const utilBtn = `${btnBase} bg-slate-100 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 text-sm`;

      return `
        <div class="grid grid-cols-4 gap-2 p-2.5 rounded-3xl bg-slate-100/80 dark:bg-slate-950/70 border border-slate-200/80 dark:border-slate-800">
          <button type="button" data-np="7" class="np-key ${digitBtn}">7</button>
          <button type="button" data-np="8" class="np-key ${digitBtn}">8</button>
          <button type="button" data-np="9" class="np-key ${digitBtn}">9</button>
          <button type="button" data-np="BACK" class="np-key ${utilBtn}" aria-label="Backspace">⌫</button>

          <button type="button" data-np="4" class="np-key ${digitBtn}">4</button>
          <button type="button" data-np="5" class="np-key ${digitBtn}">5</button>
          <button type="button" data-np="6" class="np-key ${digitBtn}">6</button>
          ${allowMathOps
            ? `<button type="button" data-np="+" class="np-key ${opBtn}">+</button>`
            : `<button type="button" data-np="CLEAR" class="np-key ${utilBtn}">C</button>`
          }

          <button type="button" data-np="1" class="np-key ${digitBtn}">1</button>
          <button type="button" data-np="2" class="np-key ${digitBtn}">2</button>
          <button type="button" data-np="3" class="np-key ${digitBtn}">3</button>
          ${allowMathOps
            ? `<button type="button" data-np="−" class="np-key ${opBtn}">−</button>`
            : `<button type="button" data-np="00" class="np-key ${utilBtn}">00</button>`
          }

          <button type="button" data-np="CLEAR" class="np-key ${utilBtn}">C</button>
          <button type="button" data-np="0" class="np-key ${digitBtn}">0</button>
          ${allowMathOps
            ? `<button type="button" data-np="×" class="np-key ${opBtn}">×</button>`
            : `<button type="button" data-np="+" class="np-key ${opBtn}">+</button>`
          }
          <button type="button" data-np="NEXT" class="np-key ${btnBase} bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm shadow-sm">${escapeHtml(nextLabel)}</button>
        </div>
      `;
    }

    function applyNumberPadKey(currentExpr, key) {
      let expr = String(currentExpr || '');
      if (key === 'CLEAR') return '';
      if (key === 'BACK') return expr.slice(0, -1);

      const isOp = key === '+' || key === '−' || key === '×';
      if (isOp) {
        if (!expr) {
          return key === '−' ? '−' : '';
        }
        const last = expr.slice(-1);
        if (last === '+' || last === '−' || last === '×') {
          return expr.slice(0, -1) + key;
        }
        return expr + key;
      }

      if (expr.length >= 24) return expr;
      return expr + key;
    }

    function bindEmojiPickerEvents({ prefix = 'ep', initialValue, onSelect }) {
      let selectedEmoji = getAvatarObj(initialValue).emoji;
      let activeCategory = 'All';
      let query = '';

      const gridEl = document.getElementById(`${prefix}-grid`);
      const previewEl = document.getElementById(`${prefix}-selected-preview`);
      const searchEl = document.getElementById(`${prefix}-search`);
      const randomBtn = document.getElementById(`${prefix}-random-btn`);

      if (!gridEl) return;

      const updateSelection = (emojiStr) => {
        selectedEmoji = emojiStr;
        if (previewEl) previewEl.textContent = emojiStr;
        if (onSelect) onSelect(emojiStr);
        renderGrid();
      };

      const renderGrid = () => {
        const q = query.trim().toLowerCase();
        const pool = state.emojiCatalog.length > 0 ? state.emojiCatalog : BUILTIN_EMOJI_CATALOG;

        const filtered = pool.filter((item) => {
          if (q) {
            return item.emoji === query.trim() || item.name.includes(q);
          }
          if (activeCategory !== 'All') {
            return item.cat === activeCategory;
          }
          return true;
        });

        const capped = filtered.slice(0, 120);
        const rawTrim = query.trim();
        const looksLikeEmoji = rawTrim && /\p{Extended_Pictographic}/u.test(rawTrim) && !capped.some((c) => c.emoji === rawTrim);

        let html = '';
        if (looksLikeEmoji) {
          html += `
            <button type="button" data-pick-emoji="${escapeHtml(rawTrim)}" class="${prefix}-emoji-btn col-span-full py-2 px-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 border-2 border-indigo-500 text-xs font-bold text-indigo-700 dark:text-indigo-300 flex items-center justify-center gap-2">
              <span class="text-xl">${escapeHtml(rawTrim)}</span>
              <span>Use this emoji</span>
            </button>
          `;
        }

        if (capped.length === 0 && !looksLikeEmoji) {
          html = `<div class="col-span-full py-6 text-center text-xs text-slate-400">No emojis matched "${escapeHtml(query)}". Try another word or paste any emoji!</div>`;
        } else {
          html += capped.map((item) => {
            const isSel = item.emoji === selectedEmoji;
            return `
              <button
                type="button"
                data-pick-emoji="${escapeHtml(item.emoji)}"
                title="${escapeHtml(item.name)}"
                class="${prefix}-emoji-btn h-10 rounded-xl flex items-center justify-center text-xl border-2 transition ${
                  isSel
                    ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/70 scale-105'
                    : 'border-transparent hover:border-slate-300 dark:hover:border-slate-600 hover:bg-white dark:hover:bg-slate-800'
                }"
              >
                ${item.emoji}
              </button>
            `;
          }).join('');
        }

        if (filtered.length > 120) {
          html += `<div class="col-span-full pt-1 text-center text-[10px] font-semibold text-slate-400">Showing 120 of ${filtered.length} emojis — type in search to find any emoji!</div>`;
        }

        gridEl.innerHTML = html;

        gridEl.querySelectorAll(`.${prefix}-emoji-btn`).forEach((btn) => {
          btn.addEventListener('click', () => {
            const em = btn.getAttribute('data-pick-emoji');
            if (em) updateSelection(em);
          });
        });
      };

      if (searchEl) {
        searchEl.addEventListener('input', (e) => {
          query = e.target.value;
          renderGrid();
        });
      }

      if (randomBtn) {
        randomBtn.addEventListener('click', () => {
          const rand = pickRandomEmoji();
          updateSelection(rand);
          showToast(`Random piece picked: ${rand}`, 'info');
        });
      }

      document.querySelectorAll(`.${prefix}-cat-btn`).forEach((btn) => {
        btn.addEventListener('click', () => {
          activeCategory = btn.getAttribute('data-ep-cat');
          document.querySelectorAll(`.${prefix}-cat-btn`).forEach((b) => {
            const act = b.getAttribute('data-ep-cat') === activeCategory;
            b.className = `${prefix}-cat-btn px-2.5 py-1 rounded-xl text-[11px] font-bold shrink-0 transition ${
              act
                ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900'
                : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'
            }`;
          });
          renderGrid();
        });
      });

      renderGrid();
    }

                  <label for="id-email-input" class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Email (for ongoing history &amp; favorites)</label>
                  <div class="flex gap-2">
                    <input
                      id="id-email-input"
                      type="email"
                      value="${escapeHtml(emailVal)}"
                      placeholder="you@example.com"
                      class="flex-1 min-w-0 px-4 py-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    <button type="button" id="id-lookup-email-btn" class="px-3.5 py-2 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 font-bold text-xs shrink-0 hover:bg-indigo-100 transition">
                      Load
                    </button>
                  </div>
                </div>
              ` : ''}

              ${buildEmojiPickerHtml(avatarVal, 'id-ep')}
            </div>

            <button type="button" id="id-submit-btn" class="w-full py-3.5 px-5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-extrabold text-sm shadow-sm transition">
              ${profileOnly ? 'Save Profile' : mode === 'create' ? 'Create Room & Enter →' : selectedSeatId !== '__new__' ? 'Claim Seat & Join →' : 'Join Room →'}
            </button>
          </div>
        `, { maxWidth: 'max-w-md' });

        const captureFields = () => {
          const nEl = document.getElementById('id-name-input');
          const eEl = document.getElementById('id-email-input');
          if (nEl) nameVal = nEl.value;
          if (eEl) emailVal = eEl.value;
        };

        document.getElementById('id-close-btn').addEventListener('click', closeModal);

        bindEmojiPickerEvents({
          prefix: 'id-ep',
          initialValue: avatarVal,
          onSelect: (emojiStr) => {
            avatarVal = emojiStr;
          },
        });

        document.querySelectorAll('.id-seat-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            captureFields();
            selectedSeatId = btn.getAttribute('data-claim-seat');
            if (selectedSeatId !== '__new__') {
              const found = unclaimedSeats.find((s) => s.seatId === selectedSeatId);
              if (found) {
                if (!nameVal.trim()) nameVal = found.name;
                avatarVal = getAvatarObj(found.avatar || avatarVal).emoji;
              }
            }
            renderIdentityModal();
          });
        });

        document.querySelectorAll('.id-tab-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            captureFields();
            authTab = btn.getAttribute('data-auth-tab');
            renderIdentityModal();
          });
        });

        const lookupBtn = document.getElementById('id-lookup-email-btn');
        if (lookupBtn) {
          lookupBtn.addEventListener('click', async () => {
            captureFields();
            const em = emailVal.trim().toLowerCase();
            if (!em || !em.includes('@')) {
              showToast('Enter a valid email address first.', 'warning');
              return;
            }
            const pid = normalizeEmailToProfileId(em);
            const existing = await fetchProfileById(pid);
            if (existing) {
              nameVal = existing.name || nameVal;
              avatarVal = getAvatarObj(existing.avatar || avatarVal).emoji;
              state.currentUser.favorites = Array.isArray(existing.favorites) ? existing.favorites : [];
              showToast(`Welcome back, ${nameVal}!`, 'success');
              renderIdentityModal();
            } else {
              showToast('No saved profile yet — we will create one when you continue.', 'info');
            }
          });
        }

        document.getElementById('id-submit-btn').addEventListener('click', async () => {
          captureFields();
          const cleanName = nameVal.trim();
          if (!cleanName) {
            showToast('Please enter your display name.', 'warning');
            return;
          }

          let profileId = null;
          let cleanEmail = '';
          const isGuest = authTab === 'guest';

          if (!isGuest) {
            cleanEmail = emailVal.trim().toLowerCase();
            if (!cleanEmail || !cleanEmail.includes('@')) {
              showToast('Please enter a valid email address or switch to Guest.', 'warning');
              return;
            }
            profileId = normalizeEmailToProfileId(cleanEmail);
            const existing = await fetchProfileById(profileId);
            const mergedFavs = Array.from(new Set([
              ...(existing?.favorites || []),
              ...(state.currentUser.favorites || []),
            ]));
            state.currentUser.favorites = mergedFavs;
            await saveUserProfile({
              profileId,
              name: cleanName,
              email: cleanEmail,
              avatar: avatarVal,
              favorites: mergedFavs,
            });
          }

          state.currentUser.name = cleanName;
          state.currentUser.email = cleanEmail;
          state.currentUser.profileId = profileId;
          state.currentUser.avatar = avatarVal;
          state.currentUser.isGuest = isGuest;
          await persistUserPreferences();

          if (profileOnly) {
            // Also update the user's seat inside an active room if present
            if (state.currentRoom) {
              const updated = JSON.parse(JSON.stringify(state.currentRoom));
              const mySeat = (updated.players || []).find((p) => p.claimedByUid === state.currentUser.uid);
              if (mySeat) {
                mySeat.name = cleanName;
                mySeat.avatar = avatarVal;
                mySeat.profileId = profileId;
                await saveRoom(updated);
              }
            }
            closeModal();
            updateHeaderUI();
            showToast('Profile updated!', 'success');
            return;
          }

          try {
            if (mode === 'create') {
              // Generate a unique 4-character code
              let code = generateRoomCode();
              for (let tries = 0; tries < 5; tries++) {
                const exists = await fetchRoom(code);
                if (!exists) break;
                code = generateRoomCode();
              }

              const newRoom = {
                code,
                hostUid: state.currentUser.uid,
                status: 'lobby',
                settings: { whoCanScore: 'anyone' },
                players: [
                  {
                    seatId: generateId('seat'),
                    name: cleanName,
                    avatar: avatarVal,
                    claimedByUid: state.currentUser.uid,
                    profileId,
                  },
                ],
                activeMatch: null,
                createdAt: Date.now(),
                updatedAt: Date.now(),
              };

              await saveRoom(newRoom);
              closeModal();
              subscribeRoom(code);
              showToast(`Room ${code} created! Share the code or invite link.`, 'success');
            } else if (mode === 'join' && targetRoom) {
              const freshRoom = (await fetchRoom(targetRoom.code)) || targetRoom;
              const updated = JSON.parse(JSON.stringify(freshRoom));
              updated.players = updated.players || [];

              if (selectedSeatId !== '__new__') {
                const seat = updated.players.find((p) => p.seatId === selectedSeatId);
                if (seat && !seat.claimedByUid) {
                  seat.name = cleanName;
                  seat.avatar = avatarVal;
                  seat.claimedByUid = state.currentUser.uid;
                  seat.profileId = profileId;
                } else {
                  updated.players.push({
                    seatId: generateId('seat'),
                    name: cleanName,
                    avatar: avatarVal,
                    claimedByUid: state.currentUser.uid,
                    profileId,
                  });
                }
              } else {
                updated.players.push({
                  seatId: generateId('seat'),
                  name: cleanName,
                  avatar: avatarVal,
                  claimedByUid: state.currentUser.uid,
                  profileId,
                });
              }

              await saveRoom(updated);
              closeModal();
              subscribeRoom(updated.code);
              showToast(`Joined Room ${updated.code}!`, 'success');
            }
          } catch (err) {
            console.error('Error creating/joining room:', err);
            showToast('Something went wrong saving your seat. Please try again.', 'error');
          }
        });
      };

      renderIdentityModal();
    }

    // MODAL 3: EDITABLE GAME RULES SETUP (Before Starting or Mid-Match)

                </div>
              </div>
            ` : ''}

            ${isScrabble ? `

                <div class="text-xs font-extrabold text-amber-800 dark:text-amber-300">Open-Ended Scoring + OUT Endgame</div>

                  <div class="text-slate-500 dark:text-slate-400">Off (Classic): subtract remaining tiles from opponents &amp; add 1× to the OUT player. On: add 2× remaining tiles to the OUT player instead of subtracting.</div>

            <button id="rs-cancel-btn" class="flex-1 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">Cancel</button>
            <button id="rs-confirm-btn" class="flex-1 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm shadow-sm transition">

        closeModal();

    // MODAL 5: GAME HISTORY (Filtered to Host & Seated Players in Room)
    function openGameHistoryModal(game) {
      const room = state.currentRoom;
      const roomUids = new Set([
        room?.hostUid,
        ...((room?.players || []).map((p) => p.claimedByUid).filter(Boolean)),
        state.currentUser.uid,
      ].filter(Boolean));

        ...((room?.players || []).map((p) => p.profileId).filter(Boolean)),
        state.currentUser.profileId,

        const uids = m.participantUids || [];
        const pids = m.participantProfileIds || [];
        return uids.some((u) => roomUids.has(u)) || pids.some((p) => roomPids.has(p)) || roomUids.has(m.hostUid);
      });

      `, { maxWidth: 'max-w-md' });

      document.getElementById('gh-close-btn').addEventListener('click', closeModal);
      document.getElementById('gh-done-btn').addEventListener('click', closeModal);
