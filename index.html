    let activeModalKeydownHandler = null;

    // =========================================================================
    // 4. UTILITIES, CLIPBOARD & SHAREABLE LINK HELPERS
    // =========================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function generateId(prefix = 'id') {
      const rand = Math.random().toString(36).slice(2, 8);
      return `${prefix}_${Date.now().toString(36)}_${rand}`;
    }

    function generateRoomCode() {
      // Excludes ambiguous chars (0, O, 1, I, L)
      const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function normalizeEmailToProfileId(email) {
      return String(email || '')
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '_');
    }

    function formatShortDate(ts) {
      if (!ts) return '';
      try {
        return new Date(ts).toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
        });
      } catch {
        return '';
      }
    }

    /**
     * Copies text safely inside both standard browsers and sandboxed iframes
     * using document.execCommand('copy').
     */
    function copyTextToClipboard(text) {
      if (!text) return false;
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (err) {
        console.error('Clipboard copy error:', err);
        return false;
      }
    }

    /**
     * Builds a shareable URL for the PWA. If currently inside a room, appends
     * `?room=CODE` so friends tapping the texted link jump straight into the table.
     */
    function buildShareablePwaLink(includeRoomCode = true) {
      let baseUrl = '';
      try {
        const loc = window.location;
        if (loc && (loc.protocol === 'http:' || loc.protocol === 'https:') && loc.origin && loc.origin !== 'null') {
          baseUrl = `${loc.origin}${loc.pathname}`;
        } else if (document.referrer && /^https?:\/\//i.test(document.referrer)) {
          const refUrl = new URL(document.referrer);
          baseUrl = `${refUrl.origin}${refUrl.pathname}`;
        }
      } catch {
        baseUrl = '';
      }

      if (!baseUrl) {
        return null;
      }

      if (includeRoomCode && state.currentRoomCode) {
        return `${baseUrl}?room=${encodeURIComponent(state.currentRoomCode)}`;
      }
      return baseUrl;
    }

    function handleQuickCopyAppLink(includeRoomCode = true) {
      const link = buildShareablePwaLink(includeRoomCode);
      const roomCode = includeRoomCode ? state.currentRoomCode : null;

      if (link) {
        const copied = copyTextToClipboard(link);
        if (copied) {
          showToast(
            roomCode
              ? `Invite link for Room ${roomCode} copied! Paste in a text to friends.`
              : 'Game Board link copied! Paste in a text to share.',
            'success'
          );
          return;
        }
      }

      // Fallback when previewing in an offline/srcdoc frame without an HTTP URL
      const fallbackText = roomCode
        ? `Join my Game Board room! Room code: ${roomCode}`
        : 'Game Board — Real-Time Scorekeeper PWA';
      copyTextToClipboard(fallbackText);
      showToast(
        roomCode
          ? `Copied invite text for Room ${roomCode} (will copy full PWA URL once hosted).`
          : 'Preview frame has no public URL yet—will copy your live PWA link once hosted!',
        'info'
      );
    }

    function getAvatarObj(avatarId) {
      if (!avatarId) return AVATARS[0];
      const legacy = AVATARS.find((a) => a.id === avatarId);
      if (legacy) return legacy;
      const str = String(avatarId).trim();
      if (!str) return AVATARS[0];
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
      }
      const color = AVATAR_BG_PALETTE[Math.abs(hash) % AVATAR_BG_PALETTE.length];
      const foundMeta = state.emojiCatalog.find((item) => item.emoji === str);
      return {
        id: str,
        emoji: str,
        label: foundMeta ? foundMeta.name : 'Game Piece',
        color,
      };
    }

    function pickRandomEmoji() {
      const pool = state.emojiCatalog.length > 0 ? state.emojiCatalog : BUILTIN_EMOJI_CATALOG;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      return pick ? pick.emoji : '🎲';
    }

    /**
     * Asynchronously loads the complete standard Unicode emoji set (~1,800+ emojis)
     * in the background so users can search every emoji or roll a true random piece.
     */
    async function loadFullEmojiCatalog() {
      if (state.emojiCatalogLoaded) return;
      try {
        const res = await fetch('https://cdn.jsdelivr.net/npm/unicode-emoji-json@0.6.0/data-by-emoji.json');
        if (!res.ok) return;
        const data = await res.json();
        const groupMap = {
          'Smileys & Emotion': 'Faces',
          'People & Body': 'Faces',
          'Animals & Nature': 'Animals',
          'Food & Drink': 'Food',
          'Travel & Places': 'Nature',
          'Activities': 'Games',
          'Objects': 'Objects',
          'Symbols': 'Objects',
          'Flags': 'Objects',
        };
        const seen = new Set(BUILTIN_EMOJI_CATALOG.map((item) => item.emoji));
        const merged = [...BUILTIN_EMOJI_CATALOG];
        Object.entries(data).forEach(([emoji, meta]) => {
          if (seen.has(emoji)) return;
          seen.add(emoji);
          merged.push({
            emoji,
            name: `${meta?.name || ''} ${meta?.group || ''}`.toLowerCase().trim(),
            cat: groupMap[meta?.group] || 'Objects',
          });
        });
        state.emojiCatalog = merged;
        state.emojiCatalogLoaded = true;
      } catch (err) {
        console.warn('Using built-in emoji catalog:', err?.message || err);
      }
    }

    /**
     * Safely evaluates simple calculator math expressions like "12+5*2-3"
     * (supporting standard + - * / as well as display glyphs − ×).
     */
    function evaluateScoreExpression(raw) {
      const cleaned = String(raw || '')
        .replace(/−/g, '-')
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/\s+/g, '');
      if (!cleaned) return 0;
      if (!/^[0-9+\-*/().]+$/.test(cleaned)) return NaN;
      try {
        // Safe restricted arithmetic evaluator using Function after strict regex whitelist
        const result = Function(`"use strict"; return (${cleaned});`)();
        if (typeof result !== 'number' || !Number.isFinite(result)) return NaN;
        return Math.round(result);
      } catch {
        return NaN;
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const styles = {
        info: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900',
        success: 'bg-emerald-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        error: 'bg-rose-600 text-white',
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-2xl shadow-xl font-bold text-xs sm:text-sm text-center transition-all duration-300 ${styles[type] || styles.info}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function updateConnectionBadge(status, label) {
      const dot = document.getElementById('connection-dot');
      const text = document.getElementById('connection-label');
      if (!dot || !text) return;
      const colors = {
        ok: 'bg-emerald-500',
        warn: 'bg-amber-400',
        local: 'bg-sky-500',
        err: 'bg-rose-500',
      };
      dot.className = `w-2 h-2 rounded-full ${colors[status] || colors.warn}`;
      text.textContent = label;
    }

    function applyTheme(theme) {
      state.theme = theme === 'dark' ? 'dark' : 'light';
      const htmlEl = document.documentElement;
      if (state.theme === 'dark') {
        htmlEl.classList.add('dark');
        htmlEl.classList.remove('light');
      } else {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
      }
    }

    function initTheme() {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');
    }

    function isHost(room = state.currentRoom) {
      if (!room || !state.currentUser.uid) return false;
      return room.hostUid === state.currentUser.uid;
    }

    function canCurrentUserScore(room = state.currentRoom) {
      if (!room) return false;
      if (isHost(room)) return true;
      return room.settings?.whoCanScore !== 'host';
    }

    function getRejoinableRooms() {
      const uid = state.currentUser.uid;
      const pid = state.currentUser.profileId;
      const recentSet = new Set(state.recentRoomCodes || []);

      return (state.openRooms || []).filter((r) => {
        if (!r || r.status === 'closed') return false;
        if (uid && r.hostUid === uid) return true;
        if (recentSet.has(r.code)) return true;
        return (r.players || []).some(
          (p) =>
            (uid && p.claimedByUid === uid) ||
            (pid && p.profileId && p.profileId === pid)
        );
      });
    }

    // =========================================================================
    // 5. FIREBASE INITIALIZATION & STRICT PATH HELPERS (RULE 1, 2, 3)
    // =========================================================================
    const getRoomsCol = () => collection(db, 'artifacts', appId, 'public', 'data', 'rooms');
    const getRoomDoc = (code) => doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
    const getProfileDoc = (pid) => doc(db, 'artifacts', appId, 'public', 'data', 'profiles', pid);
    const getMatchesCol = () => collection(db, 'artifacts', appId, 'public', 'data', 'matches');
    const getMatchDoc = (mid) => doc(db, 'artifacts', appId, 'public', 'data', 'matches', mid);
    const getSavedMatchesCol = () => collection(db, 'artifacts', appId, 'public', 'data', 'savedMatches');
    const getSavedMatchDoc = (sid) => doc(db, 'artifacts', appId, 'public', 'data', 'savedMatches', sid);
    const getUserPrefsDoc = (uid) => doc(db, 'artifacts', appId, 'users', uid, 'preferences', 'settings');

    async function loadUserPreferencesFromStore() {
      if (isLocalFallback) {
        if (localStore.userPrefs) {
          applyLoadedPrefs(localStore.userPrefs);
        }
        return;
      }
      if (!fbUser) return;
      try {
        const snap = await getDoc(getUserPrefsDoc(fbUser.uid));
        if (snap.exists()) {
          applyLoadedPrefs(snap.data());
        }
      } catch (err) {
        console.warn('Could not load user preferences:', err?.message || err);
      }
    }

    function applyLoadedPrefs(prefs) {
      if (!prefs) return;
      if (prefs.theme === 'dark' || prefs.theme === 'light') {
        applyTheme(prefs.theme);
      }
      if (prefs.name) state.currentUser.name = prefs.name;
      if (prefs.email) state.currentUser.email = prefs.email;
      if (prefs.profileId) state.currentUser.profileId = prefs.profileId;
      if (prefs.avatar) state.currentUser.avatar = getAvatarObj(prefs.avatar).emoji;
      if (typeof prefs.isGuest === 'boolean') state.currentUser.isGuest = prefs.isGuest;
      if (Array.isArray(prefs.favorites)) state.currentUser.favorites = prefs.favorites;
      if (Array.isArray(prefs.recentRoomCodes)) state.recentRoomCodes = prefs.recentRoomCodes;
    }

    async function persistUserPreferences() {
      const payload = {
        theme: state.theme,
        name: state.currentUser.name || '',
        email: state.currentUser.email || '',
        profileId: state.currentUser.profileId || null,
        avatar: state.currentUser.avatar || '♟️',
        isGuest: Boolean(state.currentUser.isGuest),
        favorites: state.currentUser.favorites || [],
        recentRoomCodes: state.recentRoomCodes || [],
        updatedAt: Date.now(),
      };
      if (isLocalFallback) {
        localStore.userPrefs = payload;
        return;
      }
      if (!fbUser) return;
      try {
        await setDoc(getUserPrefsDoc(fbUser.uid), payload, { merge: true });
      } catch (err) {
        console.warn('Could not persist user preferences:', err?.message || err);
      }
    }

    function rememberRoomCode(code) {
      const clean = String(code || '').replace(/\s+/g, '').toUpperCase();
      if (!clean) return;
      state.recentRoomCodes = [clean, ...state.recentRoomCodes.filter((c) => c !== clean)].slice(0, 12);
      persistUserPreferences();
    }

    function forgetRoomCode(code) {
      const clean = String(code || '').replace(/\s+/g, '').toUpperCase();
      state.recentRoomCodes = state.recentRoomCodes.filter((c) => c !== clean);
      persistUserPreferences();
    }

    async function initFirebase() {
  try {
    let firebaseConfig = CUSTOM_FIREBASE_CONFIG;
    if (!firebaseConfig && typeof __firebase_config !== 'undefined' && __firebase_config) {
      firebaseConfig = typeof __firebase_config === 'string'
        ? JSON.parse(__firebase_config)
        : __firebase_config;
    }

    if (!firebaseConfig || !firebaseConfig.apiKey) {
      isLocalFallback = true;
      state.currentUser.uid = generateId('local_u');
      updateConnectionBadge('local', 'Local Session Mode');
      render();
      handlePendingInviteParam();
      return;
    }

    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);

    // Authenticate BEFORE any Firestore queries.
    // Use Anonymous Auth when connected to a custom Firebase project so Canvas tokens don't conflict.
    if (!CUSTOM_FIREBASE_CONFIG && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
      await signInWithCustomToken(auth, __initial_auth_token);
    } else {
      await signInAnonymously(auth);
    }

    fbUser = auth.currentUser;
    if (!fbUser) {
      await new Promise((resolve) => {
        const unsub = onAuthStateChanged(auth, (u) => {
          if (u) {
            fbUser = u;
            unsub();
            resolve();
          }
        });
      });
    }

    state.currentUser.uid = fbUser.uid;
    updateConnectionBadge('ok', 'Live Sync Ready');
    await loadUserPreferencesFromStore();
    subscribeOpenRooms();
    subscribeMatchHistory();
    subscribeSavedMatches();
    render();

    if (state.pendingInviteCode) {
      await handlePendingInviteParam();
    } else {
      const savedRoom = localStorage.getItem('gb_active_room');
      if (savedRoom) {
        subscribeRoom(savedRoom);
      }
    }
  } catch (err) {
    console.error('Firebase initialization failed, falling back to local session:', err);
    isLocalFallback = true;
    state.currentUser.uid = state.currentUser.uid || generateId('local_u');
    if (err?.code === 'auth/operation-not-allowed' || err?.code === 'auth/admin-restricted-operation') {
      updateConnectionBadge('warn', 'Enable Anonymous Auth');
      showToast('Enable Anonymous Sign-In in Firebase Console → Authentication to sync live.', 'warning');
    } else {
      updateConnectionBadge('warn', 'Offline Session Mode');
    }
    render();
  }
}

    function subscribeOpenRooms() {
      if (isLocalFallback || !fbUser) return;
      if (state.openRoomsUnsubscribe) state.openRoomsUnsubscribe();

      state.openRoomsUnsubscribe = onSnapshot(
        getRoomsCol(),
        (snap) => {
          const list = [];
          snap.forEach((docSnap) => {
            const d = docSnap.data();
            if (d && d.status !== 'closed') {
              list.push(d);
            }
          });
          list.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
          state.openRooms = list;
          if (state.view === 'landing') {
            render();
          }
        },
        (err) => {
          console.error('Error listening to rooms:', err);
          if (err?.code === 'permission-denied') {
            updateConnectionBadge('warn', 'Preview Auth Required');
          }
        }
      );
    }

    function subscribeMatchHistory() {
      if (isLocalFallback || !fbUser) return;
      if (state.historyUnsubscribe) state.historyUnsubscribe();

      state.historyUnsubscribe = onSnapshot(
        getMatchesCol(),
        (snap) => {
          const list = [];
          snap.forEach((docSnap) => {
            const d = docSnap.data();
            if (d) list.push(d);
          });
          list.sort((a, b) => (b.finishedAt || b.createdAt || 0) - (a.finishedAt || a.createdAt || 0));
          state.matchHistory = list;
        },
        (err) => {
          console.error('Error listening to match history:', err);
        }
      );
    }

    function subscribeSavedMatches() {
      if (isLocalFallback || !fbUser) return;
      if (state.savedMatchesUnsubscribe) state.savedMatchesUnsubscribe();

      state.savedMatchesUnsubscribe = onSnapshot(
        getSavedMatchesCol(),
        (snap) => {
          const list = [];
          snap.forEach((docSnap) => {
            const d = docSnap.data();
            if (d) list.push(d);
          });
          list.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
          state.savedMatches = list;
          if (state.view === 'lobby') {
            render();
          }
        },
        (err) => {
          console.error('Error listening to saved matches:', err);
        }
      );
    }

    function subscribeRoom(roomCode) {
  if (state.roomUnsubscribe) {
    state.roomUnsubscribe();
    state.roomUnsubscribe = null;
  }
  const cleanCode = String(roomCode || '').replace(/\s+/g, '').toUpperCase();
  state.currentRoomCode = cleanCode;
  rememberRoomCode(cleanCode);
  localStorage.setItem('gb_active_room', cleanCode);
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('room', cleanCode);
    window.history.replaceState({}, '', url.toString());
  } catch {}

  if (isLocalFallback) {
    const localRoom = localStore.rooms[cleanCode];
    if (!localRoom || localRoom.status === 'closed') {
      leaveRoomLocal();
      return;
    }
    state.currentRoom = JSON.parse(JSON.stringify(localRoom));
    state.view = state.currentRoom.activeMatch ? 'match' : 'lobby';
    render();
    return;
  }

  if (!fbUser) return;
  state.roomUnsubscribe = onSnapshot(
    getRoomDoc(cleanCode),
    (docSnap) => {
      if (!docSnap.exists()) {
        forgetRoomCode(cleanCode);
        showToast('This room no longer exists.', 'warning');
        leaveRoomLocal();
        return;
      }
      const data = docSnap.data();
      if (data.status === 'closed') {
        forgetRoomCode(cleanCode);
        showToast(`Room ${cleanCode} was closed by the host.`, 'info');
        leaveRoomLocal();
        return;
      }
      state.currentRoom = data;
      state.view = data.activeMatch ? 'match' : 'lobby';
      render();
    },
    (err) => {
      console.error('Room listener error:', err);
      showToast('Lost connection to room. Reconnecting...', 'error');
    }
  );
}

    function leaveRoomLocal() {
  if (state.roomUnsubscribe) {
    state.roomUnsubscribe();
    state.roomUnsubscribe = null;
  }
  state.currentRoomCode = null;
  state.currentRoom = null;
  state.yahtzeeActiveGameIdx = 0;
  state.yahtzeeViewingSeatId = null;
  state.view = 'landing';
  localStorage.removeItem('gb_active_room');
  try {
    const url = new URL(window.location.href);
    url.searchParams.delete('room');
    window.history.replaceState({}, '', url.toString());
  } catch {}
  render();
}

    // =========================================================================
    // 6. DATA LAYER (Room, Profile, History & Saved Match CRUD)
    // =========================================================================
    async function fetchRoom(code) {
      const clean = String(code || '').replace(/\s+/g, '').toUpperCase();
      if (!clean) return null;
      if (isLocalFallback) {
        const r = localStore.rooms[clean];
        return r && r.status !== 'closed' ? JSON.parse(JSON.stringify(r)) : null;
      }
      if (!fbUser) return null;
      const snap = await getDoc(getRoomDoc(clean));
      if (!snap.exists()) return null;
      const data = snap.data();
      return data && data.status !== 'closed' ? data : null;
    }


    async function syncCurrentRoomNow({ silent = true } = {}) {
  if (!state.currentRoomCode || isLocalFallback || !fbUser) return state.currentRoom;
  try {
    const fresh = await fetchRoom(state.currentRoomCode);
    if (fresh) {
      state.currentRoom = fresh;
      state.view = fresh.activeMatch ? 'match' : 'lobby';
      render();
      if (!silent) showToast('Scores synced!', 'success');
      return fresh;
    }
  } catch (err) {
    console.warn('Manual room sync failed:', err);
    if (!silent) showToast('Could not refresh scores. Check connection.', 'error');
  }
  return state.currentRoom;
}

    function getSavedMatchesForCurrentRoom() {

    // =========================================================================
    // 7. SCORING & MATCH LIFECYCLE LOGIC
    // =========================================================================
    const YAHTZEE_UPPER_CATS = [
      { key: 'ones', label: 'Ones', short: '1s', face: 1, par: 3, pip: '⚀' },
      { key: 'twos', label: 'Twos', short: '2s', face: 2, par: 6, pip: '⚁' },
      { key: 'threes', label: 'Threes', short: '3s', face: 3, par: 9, pip: '⚂' },
      { key: 'fours', label: 'Fours', short: '4s', face: 4, par: 12, pip: '⚃' },
      { key: 'fives', label: 'Fives', short: '5s', face: 5, par: 15, pip: '⚄' },
      { key: 'sixes', label: 'Sixes', short: '6s', face: 6, par: 18, pip: '⚅' },
    ];

    const YAHTZEE_LOWER_CATS = [
      { key: 'threeKind', label: '3 of a Kind', hint: 'Sum of all dice', fixed: false },
      { key: 'fourKind', label: '4 of a Kind', hint: 'Sum of all dice', fixed: false },
      { key: 'fullHouse', label: 'Full House', hint: '3 of one + 2 of another', fixed: true, ruleKey: 'fullHouse', fallback: 25 },
      { key: 'smallStraight', label: 'Small Straight', hint: 'Sequence of 4 dice', fixed: true, ruleKey: 'smallStraight', fallback: 30 },
      { key: 'largeStraight', label: 'Large Straight', hint: 'Sequence of 5 dice', fixed: true, ruleKey: 'largeStraight', fallback: 40 },
      { key: 'yahtzee', label: 'Yahtzee', hint: '5 of a kind', fixed: true, ruleKey: 'yahtzee', fallback: 50 },
      { key: 'chance', label: 'Chance', hint: 'Sum of any dice', fixed: false },
    ];

    function createEmptyYahtzeeGame() {
      return {
        ones: null,
        twos: null,
        threes: null,
        fours: null,
        fives: null,
        sixes: null,
        threeKind: null,
        fourKind: null,
        fullHouse: null,
        smallStraight: null,
        largeStraight: null,
        yahtzee: null,
        chance: null,
        yahtzeeBonusCount: 0,
        yahtzeeBonusPoints: null,
      };
    }

    function getYahtzeeGameSheet(match, seatId, gameIdx) {
      const sheet = match?.yahtzeeSheets?.[seatId]?.[String(gameIdx)];
      return sheet ? { ...createEmptyYahtzeeGame(), ...sheet } : createEmptyYahtzeeGame();
    }

    function getYahtzeeBonusUnit(rules) {
      const val = Number(rules?.yahtzeeBonus);
      return Number.isFinite(val) && val >= 0 ? val : 100;
    }

    function computeYahtzeeGameStats(sheet, rules = {}) {
      const s = { ...createEmptyYahtzeeGame(), ...(sheet || {}) };
      let upperSubtotal = 0;
      let upperFilledCount = 0;
      let upperPaceDelta = 0;

      YAHTZEE_UPPER_CATS.forEach((cat) => {
        const val = s[cat.key];
        if (val !== null && val !== undefined) {
          const num = Number(val) || 0;
          upperSubtotal += num;
          upperFilledCount += 1;
          upperPaceDelta += num - cat.par;
        }
      });

      const upperBonus = upperSubtotal >= 63 ? 35 : 0;
      const upperTotal = upperSubtotal + upperBonus;

      let lowerCategoriesSum = 0;
      let lowerFilledCount = 0;
      YAHTZEE_LOWER_CATS.forEach((cat) => {
        const val = s[cat.key];
        if (val !== null && val !== undefined) {
          lowerCategoriesSum += Number(val) || 0;
          lowerFilledCount += 1;
        }
      });

      const bonusUnit = getYahtzeeBonusUnit(rules);
      const bonusCount = Math.max(0, Number(s.yahtzeeBonusCount) || 0);
      const yahtzeeBonusTotal =
        s.yahtzeeBonusPoints !== null && s.yahtzeeBonusPoints !== undefined
          ? Math.max(0, Number(s.yahtzeeBonusPoints) || 0)
          : bonusCount * bonusUnit;

      const lowerSubtotal = lowerCategoriesSum + yahtzeeBonusTotal;
      const filledCount = upperFilledCount + lowerFilledCount;
      const gameTotal = upperTotal + lowerSubtotal;

      return {
        upperSubtotal,
        upperBonus,
        upperTotal,
        upperFilledCount,
        upperPaceDelta,
        lowerCategoriesSum,
        yahtzeeBonusCount: bonusCount,
        yahtzeeBonusTotal,
        lowerSubtotal,
        lowerFilledCount,
        filledCount,
        gameTotal,
      };
    }

    function computeYahtzeePlayerStats(room, seatId) {
      const match = room?.activeMatch;
      const rules = match?.rules || {};
      const numGames = Math.max(1, parseInt(rules.numGames, 10) || 1);
      const games = [];
      let overallTotal = 0;
      let totalFilled = 0;

      for (let i = 0; i < numGames; i++) {
        const stats = computeYahtzeeGameStats(getYahtzeeGameSheet(match, seatId, i), rules);
        games.push(stats);
        overallTotal += stats.gameTotal;
        totalFilled += stats.filledCount;
      }

      return {
        games,
        overallTotal,
        totalFilled,
        totalSlots: numGames * 13,
      };
    }

    function isYahtzeeMatchComplete(room) {
      const players = room?.players || [];
      if (players.length === 0 || room?.activeMatch?.gameId !== 'yahtzee') return false;
      return players.every((p) => {
        const ps = computeYahtzeePlayerStats(room, p.seatId);
        return ps.totalSlots > 0 && ps.totalFilled >= ps.totalSlots;
      });
    }

    function isLowestScoreWins(match) {
      return match?.gameId === 'golf';
    }

    function computePlayerTotals(room) {
      const totals = {};
      if (!room) return totals;
      (room.players || []).forEach((p) => {
        totals[p.seatId] = 0;
      });

      if (room.activeMatch?.gameId === 'yahtzee') {
        (room.players || []).forEach((p) => {
          totals[p.seatId] = computeYahtzeePlayerStats(room, p.seatId).overallTotal;
        });
        return totals;
      }

      const rounds = room.activeMatch?.rounds || [];
      rounds.forEach((r) => {
        Object.entries(r.scores || {}).forEach(([seatId, pts]) => {
          if (pts === null || pts === undefined) return;
          const val = Number(pts) || 0;
          totals[seatId] = (totals[seatId] || 0) + val;
        });
      });
      return totals;
    }

    function computeStandings(room) {
      const totals = computePlayerTotals(room);
      const lowWins = isLowestScoreWins(room?.activeMatch);
      return (room.players || [])
        .map((p) => ({ ...p, total: totals[p.seatId] || 0 }))
        .sort((a, b) => (lowWins ? a.total - b.total : b.total - a.total));
    }

    async function updateYahtzeeCell(seatId, gameIdx, patchObj) {
      const room = state.currentRoom;
      if (!room || !room.activeMatch || room.activeMatch.gameId !== 'yahtzee') return;

      const gKey = String(gameIdx);
      const updated = JSON.parse(JSON.stringify(room));
      updated.activeMatch.yahtzeeSheets = updated.activeMatch.yahtzeeSheets || {};
      updated.activeMatch.yahtzeeSheets[seatId] = updated.activeMatch.yahtzeeSheets[seatId] || {};
      const existingGame = {
        ...createEmptyYahtzeeGame(),
        ...(updated.activeMatch.yahtzeeSheets[seatId][gKey] || {}),
        ...patchObj,
      };
      updated.activeMatch.yahtzeeSheets[seatId][gKey] = existingGame;

      // Check whether every seated player has now finished all scorecards
      if (isYahtzeeMatchComplete(updated)) {
        await finalizeMatch(updated);
        return;
      }

      if (isLocalFallback) {
        await saveRoom(updated);
        return;
      }

      if (!fbUser) return;
      try {
        // Atomic per-seat field update prevents concurrent players overwriting each other's sheets
        const fieldUpdates = { updatedAt: Date.now() };
        Object.entries(patchObj).forEach(([field, value]) => {
          fieldUpdates[`activeMatch.yahtzeeSheets.${seatId}.${gKey}.${field}`] = value;
        });
        await updateDoc(getRoomDoc(room.code), fieldUpdates);
      } catch (err) {
        console.warn('Falling back to full room save for Yahtzee update:', err?.message || err);
        await saveRoom(updated);
      }
    }

    async function startNewMatchInRoom(game, rulesObj) {
      if (!state.currentRoom) return;
      const updated = JSON.parse(JSON.stringify(state.currentRoom));
      const mergedRules = { ...game.defaultRules, ...(rulesObj || {}) };
      updated.status = 'playing';
      updated.activeMatch = {
        matchId: generateId('match'),
        gameId: game.id,
        gameName: game.name,
        rules: mergedRules,
        rounds: [],
        startedAt: Date.now(),
        finishedAt: null,
        winnerSeatIds: [],
      };

      if (game.id === 'yahtzee') {
        const numGames = Math.max(1, parseInt(mergedRules.numGames, 10) || 1);
        const sheets = {};
        (updated.players || []).forEach((p) => {
          sheets[p.seatId] = {};
          for (let i = 0; i < numGames; i++) {
            sheets[p.seatId][String(i)] = createEmptyYahtzeeGame();
          }
        });
        updated.activeMatch.yahtzeeSheets = sheets;
      }

      state.yahtzeeActiveGameIdx = 0;
      state.yahtzeeViewingSeatId = null;

      await saveRoom(updated);
      showToast(`Started ${game.name}!`, 'success');
    }

    async function finalizeMatch(roomObj) {
      const standings = computeStandings(roomObj);
      const bestScore = standings.length > 0 ? standings[0].total : 0;
      const winners = standings.filter((p) => p.total === bestScore);
      const winnerSeatIds = winners.map((w) => w.seatId);

      roomObj.status = 'finished';
      roomObj.activeMatch.finishedAt = Date.now();
      roomObj.activeMatch.winnerSeatIds = winnerSeatIds;

      // Save match history record for room participants
      const participantUids = [...new Set([
        roomObj.hostUid,
        ...(roomObj.players || []).map((p) => p.claimedByUid).filter(Boolean),
      ])];
      const participantProfileIds = [...new Set(
        (roomObj.players || []).map((p) => p.profileId).filter(Boolean)
      )];

      const roundCount = roomObj.activeMatch.gameId === 'yahtzee'
        ? Math.max(1, parseInt(roomObj.activeMatch.rules?.numGames, 10) || 1)
        : (roomObj.activeMatch.rounds || []).length;

      const historyRecord = {
        matchId: roomObj.activeMatch.matchId || generateId('match'),
        roomCode: roomObj.code,
        gameId: roomObj.activeMatch.gameId,
        gameName: roomObj.activeMatch.gameName,
        hostUid: roomObj.hostUid,
        participantUids,
        participantProfileIds,
        standings: standings.map((s) => ({
          seatId: s.seatId,
          name: s.name,
          avatar: s.avatar,
          total: s.total,
        })),
        winnerNames: winners.map((w) => w.name),
        roundCount,
        finishedAt: roomObj.activeMatch.finishedAt,
      };

      await saveMatchRecord(historyRecord);
      await saveRoom(roomObj);

      const winLabel = winners.map((w) => w.name).join(' & ');
      showToast(`🏆 ${winLabel} won ${roomObj.activeMatch.gameName}!`, 'success');
    }

    async function saveActiveGameForLater() {
      const room = state.currentRoom;
      if (!room || !room.activeMatch) return;

      const totals = computePlayerTotals(room);
      const savedObj = {
        savedId: generateId('saved'),
        roomCode: room.code,
        hostUid: room.hostUid,
        gameId: room.activeMatch.gameId,
        gameName: room.activeMatch.gameName,
        match: JSON.parse(JSON.stringify(room.activeMatch)),
        playersSnapshot: (room.players || []).map((p) => ({
          ...p,
          total: totals[p.seatId] || 0,
        })),
        savedAt: Date.now(),
      };

      await savePausedMatchRecord(savedObj);

      const updated = JSON.parse(JSON.stringify(room));
      updated.status = 'lobby';
      updated.activeMatch = null;
      await saveRoom(updated);
      showToast(`${savedObj.gameName} saved for later! Resume anytime from the lobby.`, 'success');
    }

    async function resumeSavedMatch(savedObj) {
      const room = state.currentRoom;
      if (!room || !savedObj) return;
      const updated = JSON.parse(JSON.stringify(room));

      // Merge any missing seats from the saved match back into the room so scores stay intact
      const existingSeatIds = new Set((updated.players || []).map((p) => p.seatId));
      (savedObj.playersSnapshot || []).forEach((sp) => {
        if (!existingSeatIds.has(sp.seatId)) {
          updated.players.push({
            seatId: sp.seatId,
            name: sp.name,
            avatar: sp.avatar,
            claimedByUid: sp.claimedByUid || null,
            profileId: sp.profileId || null,
          });
        }
      });

      updated.status = 'playing';
      updated.activeMatch = JSON.parse(JSON.stringify(savedObj.match));
      state.yahtzeeActiveGameIdx = 0;
      state.yahtzeeViewingSeatId = null;
      await saveRoom(updated);
      await deleteSavedMatchRecord(savedObj.savedId);
      showToast(`Resumed ${savedObj.gameName}!`, 'success');
    }

    async function discardActiveGame() {
      const room = state.currentRoom;
      if (!room) return;
      const name = room.activeMatch?.gameName || 'Game';
      const updated = JSON.parse(JSON.stringify(room));
      updated.status = 'lobby';
      updated.activeMatch = null;
      await saveRoom(updated);
      showToast(`${name} discarded.`, 'info');
    }

    async function closeCurrentRoom({ saveActiveFirst = false } = {}) {
      const room = state.currentRoom;
      if (!room) return;

      if (saveActiveFirst && room.activeMatch && room.status === 'playing') {
        const totals = computePlayerTotals(room);
        await savePausedMatchRecord({
          savedId: generateId('saved'),
          roomCode: room.code,
          hostUid: room.hostUid,
          gameId: room.activeMatch.gameId,
          gameName: room.activeMatch.gameName,
          match: JSON.parse(JSON.stringify(room.activeMatch)),
          playersSnapshot: (room.players || []).map((p) => ({
            ...p,
            total: totals[p.seatId] || 0,
          })),
          savedAt: Date.now(),
        });
      }

      const updated = JSON.parse(JSON.stringify(room));
      updated.status = 'closed';
      updated.activeMatch = null;
      updated.closedAt = Date.now();
      await saveRoom(updated);
      forgetRoomCode(room.code);
      showToast(
        saveActiveFirst
          ? `Game saved & Room ${room.code} closed.`
          : `Room ${room.code} closed.`,
        'info'
      );
      leaveRoomLocal();
    }

    async function toggleFavoriteGame(gameId) {
      const favs = new Set(state.currentUser.favorites || []);
      if (favs.has(gameId)) {
        favs.delete(gameId);
      } else {
        favs.add(gameId);
      }
      state.currentUser.favorites = Array.from(favs);
      await persistUserPreferences();

      if (state.currentUser.profileId) {
        await saveUserProfile({
          profileId: state.currentUser.profileId,
          name: state.currentUser.name,
          email: state.currentUser.email,
          avatar: state.currentUser.avatar,
          favorites: state.currentUser.favorites,
        });
      }
      render();
    }

    async function initiateJoinRoomFlow(code) {
  const cleanCode = String(code || '').replace(/\s+/g, '').toUpperCase();
  try {
    const room = await fetchRoom(cleanCode);
    if (!room) {
      forgetRoomCode(cleanCode);
      showToast(`Room "${cleanCode}" wasn't found or has been closed.`, 'error');
      return;
    }

    const matchingSeat = (room.players || []).find(
      (p) =>
        (state.currentUser.uid && p.claimedByUid === state.currentUser.uid) ||
        (state.currentUser.profileId && p.profileId && p.profileId === state.currentUser.profileId)
    );

    if (matchingSeat) {
      // If the host pre-linked this seat by email, claim it for this device automatically
      if (!matchingSeat.claimedByUid && state.currentUser.uid) {
        const updated = JSON.parse(JSON.stringify(room));
        const target = (updated.players || []).find((p) => p.seatId === matchingSeat.seatId);
        if (target) {
          target.claimedByUid = state.currentUser.uid;
          await saveRoom(updated);
        }
      }
      subscribeRoom(room.code);
      showToast(`Rejoined room ${room.code}!`, 'success');
      return;
    }

    openJoinOrCreateIdentityModal({ mode: 'join', targetRoom: room });
  } catch (err) {
    console.error('Failed joining room:', err);
    if (err?.code === 'permission-denied') {
      showToast('Preview database denied access in this session (Incognito needs a signed-in preview or your own Firebase config).', 'error');
    } else {
      showToast(`Could not connect to room (${err?.code || 'network error'}). Please try again.`, 'error');
    }
  }
}

    function renderMatchView(container) {
  const room = state.currentRoom;
  const match = room.activeMatch;
  if (match.gameId === 'yahtzee') {
    renderYahtzeeMatchView(container);
    return;
  }
  const game = GAME_CATALOG.find((g) => g.id === match.gameId);
  const host = isHost(room);
  const canScore = canCurrentUserScore(room);
  const isFinished = room.status === 'finished';
  const isGin = match.gameId === 'gin-rummy';
  const isScrabble = match.gameId === 'scrabble';

    // =========================================================================
    // 9D. VIEW: YAHTZEE INTERACTIVE SCORECARD & COMPACT LEADERBOARD
    // =========================================================================
    function renderYahtzeeMatchView(container) {
      const room = state.currentRoom;
      const match = room.activeMatch;
      const game = GAME_CATALOG.find((g) => g.id === 'yahtzee');
      const rules = { ...(game?.defaultRules || {}), ...(match.rules || {}) };
      const numGames = Math.max(1, parseInt(rules.numGames, 10) || 1);
      const bonusUnit = getYahtzeeBonusUnit(rules);
      const host = isHost(room);
      const canScore = canCurrentUserScore(room);
      const isFinished = room.status === 'finished';

      const players = room.players || [];
      const mySeat = players.find((p) => p.claimedByUid && p.claimedByUid === state.currentUser.uid) || null;

      // Determine active sheet seat (defaults to your own seat; host or anyone with open seats can switch)
      let viewingSeat = players.find((p) => p.seatId === state.yahtzeeViewingSeatId) || mySeat || players[0] || null;
      if (viewingSeat) {
        state.yahtzeeViewingSeatId = viewingSeat.seatId;
      }

      // Clamp active game index
      if (state.yahtzeeActiveGameIdx >= numGames) {
        state.yahtzeeActiveGameIdx = numGames - 1;
      }
      if (state.yahtzeeActiveGameIdx < 0) {
        state.yahtzeeActiveGameIdx = 0;
      }
      const activeGameIdx = state.yahtzeeActiveGameIdx;

      const standings = computeStandings(room);
      const winnerSet = new Set(match.winnerSeatIds || []);
      const winnerNames = standings.filter((s) => winnerSet.has(s.seatId)).map((s) => s.name);

      // Compute viewing player's stats
      const viewingPlayerStats = viewingSeat ? computeYahtzeePlayerStats(room, viewingSeat.seatId) : null;
      const activeSheet = viewingSeat ? getYahtzeeGameSheet(match, viewingSeat.seatId, activeGameIdx) : createEmptyYahtzeeGame();
      const activeStats = viewingPlayerStats ? viewingPlayerStats.games[activeGameIdx] : computeYahtzeeGameStats(activeSheet, rules);
      const canEditViewingSheet = !isFinished && canScore && Boolean(viewingSeat);
      const canSwitchSeats = players.length > 1 && (host || players.some((p) => !p.claimedByUid));

      // Upper bonus pace pill formatting
      const upperPointsNeeded = Math.max(0, 63 - activeStats.upperSubtotal);
      let paceBadgeHtml = '';
      if (activeStats.upperBonus > 0) {
        paceBadgeHtml = `
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-emerald-100 dark:bg-emerald-950/70 border border-emerald-300 dark:border-emerald-700 text-emerald-800 dark:text-emerald-300 text-xs font-extrabold">
            ✓ +35 Bonus Locked!
          </span>
        `;
      } else if (activeStats.upperFilledCount === 6) {
        paceBadgeHtml = `
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-xs font-bold">
            No Bonus (${upperPointsNeeded} short)
          </span>
        `;
      } else if (activeStats.upperFilledCount === 0) {
        paceBadgeHtml = `
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-bold">
            Target: 63 (+35 bonus)
          </span>
        `;
      } else {
        const pace = activeStats.upperPaceDelta;

    function buildNumberPadHtml({ nextLabel = 'Next ↵', allowMathOps = true, showSignToggle = false } = {}) {
      const btnBase = 'h-12 sm:h-13 rounded-2xl font-extrabold text-lg select-none active:scale-95 transition flex items-center justify-center';
      const digitBtn = `${btnBase} bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-700 shadow-sm`;
      const opBtn = `${btnBase} bg-indigo-50 dark:bg-indigo-950/70 border border-indigo-200/80 dark:border-indigo-800/80 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-900/70`;
      const utilBtn = `${btnBase} bg-slate-100 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 text-sm`;

      return `
        <div class="grid grid-cols-4 gap-2 p-2.5 rounded-3xl bg-slate-100/80 dark:bg-slate-950/70 border border-slate-200/80 dark:border-slate-800">
          <button type="button" data-np="7" class="np-key ${digitBtn}">7</button>
          <button type="button" data-np="8" class="np-key ${digitBtn}">8</button>
          <button type="button" data-np="9" class="np-key ${digitBtn}">9</button>
          <button type="button" data-np="BACK" class="np-key ${utilBtn}" aria-label="Backspace">⌫</button>

          <button type="button" data-np="4" class="np-key ${digitBtn}">4</button>
          <button type="button" data-np="5" class="np-key ${digitBtn}">5</button>
          <button type="button" data-np="6" class="np-key ${digitBtn}">6</button>
          ${allowMathOps
            ? `<button type="button" data-np="+" class="np-key ${opBtn}">+</button>`
            : `<button type="button" data-np="CLEAR" class="np-key ${utilBtn}">C</button>`
          }

          <button type="button" data-np="1" class="np-key ${digitBtn}">1</button>
          <button type="button" data-np="2" class="np-key ${digitBtn}">2</button>
          <button type="button" data-np="3" class="np-key ${digitBtn}">3</button>
          ${allowMathOps
            ? `<button type="button" data-np="−" class="np-key ${opBtn}">−</button>`
            : `<button type="button" data-np="00" class="np-key ${utilBtn}">00</button>`
          }

          <button type="button" data-np="CLEAR" class="np-key ${utilBtn}">C</button>
          <button type="button" data-np="0" class="np-key ${digitBtn}">0</button>
          ${showSignToggle
            ? `<button type="button" data-np="SIGN" class="np-key ${opBtn}" aria-label="Toggle negative">±</button>`
            : allowMathOps
              ? `<button type="button" data-np="×" class="np-key ${opBtn}">×</button>`
              : `<button type="button" data-np="+" class="np-key ${opBtn}">+</button>`
          }
          <button type="button" data-np="NEXT" class="np-key ${btnBase} bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm shadow-sm">${escapeHtml(nextLabel)}</button>
        </div>
      `;
    }

    function applyNumberPadKey(currentExpr, key) {
      let expr = String(currentExpr || '');
      if (key === 'CLEAR') return '';
      if (key === 'BACK') return expr.slice(0, -1);

      if (key === 'SIGN') {
        if (!expr) return '−';
        if (expr === '−') return '';
        if (/[+−×]/.test(expr.slice(1))) {
          const evaluated = evaluateScoreExpression(expr);
          if (!Number.isNaN(evaluated)) {
            const flipped = -evaluated;
            return flipped < 0 ? `−${Math.abs(flipped)}` : String(flipped);
          }
        }
        return expr.startsWith('−') ? expr.slice(1) : `−${expr}`;
      }

      const isOp = key === '+' || key === '−' || key === '×';
      if (isOp) {
        if (!expr) {
          return key === '−' ? '−' : '';
        }
        const last = expr.slice(-1);
        if (last === '+' || last === '−' || last === '×') {
          return expr.slice(0, -1) + key;
        }
        return expr + key;
      }

      if (expr.length >= 24) return expr;
      return expr + key;
    }

    function bindEmojiPickerEvents({ prefix = 'ep', initialValue, onSelect }) {
      let selectedEmoji = getAvatarObj(initialValue).emoji;
      let activeCategory = 'All';
      let query = '';

      const gridEl = document.getElementById(`${prefix}-grid`);
      const previewEl = document.getElementById(`${prefix}-selected-preview`);
      const searchEl = document.getElementById(`${prefix}-search`);
      const randomBtn = document.getElementById(`${prefix}-random-btn`);

      if (!gridEl) return;

      const updateSelection = (emojiStr) => {
        selectedEmoji = emojiStr;
        if (previewEl) previewEl.textContent = emojiStr;
        if (onSelect) onSelect(emojiStr);
        renderGrid();
      };

      const renderGrid = () => {
        const q = query.trim().toLowerCase();
        const pool = state.emojiCatalog.length > 0 ? state.emojiCatalog : BUILTIN_EMOJI_CATALOG;

        const filtered = pool.filter((item) => {
          if (q) {
            return item.emoji === query.trim() || item.name.includes(q);
          }
          if (activeCategory !== 'All') {
            return item.cat === activeCategory;
          }
          return true;
        });

        const capped = filtered.slice(0, 120);
        const rawTrim = query.trim();
        const looksLikeEmoji = rawTrim && /\p{Extended_Pictographic}/u.test(rawTrim) && !capped.some((c) => c.emoji === rawTrim);

        let html = '';
        if (looksLikeEmoji) {
          html += `
            <button type="button" data-pick-emoji="${escapeHtml(rawTrim)}" class="${prefix}-emoji-btn col-span-full py-2 px-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 border-2 border-indigo-500 text-xs font-bold text-indigo-700 dark:text-indigo-300 flex items-center justify-center gap-2">
              <span class="text-xl">${escapeHtml(rawTrim)}</span>
              <span>Use this emoji</span>
            </button>
          `;
        }

        if (capped.length === 0 && !looksLikeEmoji) {
          html = `<div class="col-span-full py-6 text-center text-xs text-slate-400">No emojis matched "${escapeHtml(query)}". Try another word or paste any emoji!</div>`;
        } else {
          html += capped.map((item) => {
            const isSel = item.emoji === selectedEmoji;
            return `
              <button
                type="button"
                data-pick-emoji="${escapeHtml(item.emoji)}"
                title="${escapeHtml(item.name)}"
                class="${prefix}-emoji-btn h-10 rounded-xl flex items-center justify-center text-xl border-2 transition ${
                  isSel
                    ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/70 scale-105'
                    : 'border-transparent hover:border-slate-300 dark:hover:border-slate-600 hover:bg-white dark:hover:bg-slate-800'
                }"
              >
                ${item.emoji}
              </button>
            `;
          }).join('');
        }

        if (filtered.length > 120) {
          html += `<div class="col-span-full pt-1 text-center text-[10px] font-semibold text-slate-400">Showing 120 of ${filtered.length} emojis — type in search to find any emoji!</div>`;
        }

        gridEl.innerHTML = html;

        gridEl.querySelectorAll(`.${prefix}-emoji-btn`).forEach((btn) => {
          btn.addEventListener('click', () => {
            const em = btn.getAttribute('data-pick-emoji');
            if (em) updateSelection(em);
          });
        });
      };

      if (searchEl) {
        searchEl.addEventListener('input', (e) => {
          query = e.target.value;
          renderGrid();
        });
      }

      if (randomBtn) {
        randomBtn.addEventListener('click', () => {
          const rand = pickRandomEmoji();
          updateSelection(rand);
          showToast(`Random piece picked: ${rand}`, 'info');
        });
      }

      document.querySelectorAll(`.${prefix}-cat-btn`).forEach((btn) => {
        btn.addEventListener('click', () => {
          activeCategory = btn.getAttribute('data-ep-cat');
          document.querySelectorAll(`.${prefix}-cat-btn`).forEach((b) => {
            const act = b.getAttribute('data-ep-cat') === activeCategory;
            b.className = `${prefix}-cat-btn px-2.5 py-1 rounded-xl text-[11px] font-bold shrink-0 transition ${
              act
                ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900'
                : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'
            }`;
          });
          renderGrid();
        });
      });

      renderGrid();
    }

                    />
                    <button type="button" id="id-lookup-email-btn" class="px-3.5 py-2 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 font-bold text-xs shrink-0 hover:bg-indigo-100 transition">
                      Load
                    </button>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        ` : ''}

        <!-- SCREEN: CHOOSE GAME PIECE -->
        ${currentStep === 'piece' ? `
          <div class="space-y-3">
            ${buildEmojiPickerHtml(avatarVal, 'id-ep')}
          </div>
        ` : ''}

        <!-- SCREEN: APP SETTINGS (DARK MODE) -->
        ${currentStep === 'settings' ? `
          <div class="space-y-4">
            <div>
              <div class="text-sm font-extrabold text-slate-900 dark:text-white">App Settings</div>
              <p class="text-xs text-slate-500 dark:text-slate-400">
                Choose how Game Board looks on your device.
              </p>
            </div>

            <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <span class="w-10 h-10 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-lg">
                  ${isDark ? '🌙' : '☀️'}
                </span>
                <div>
                  <div class="text-sm font-extrabold text-slate-900 dark:text-white">Dark Mode</div>
                  <div class="text-xs text-slate-500 dark:text-slate-400">${isDark ? 'Dark theme active' : 'Light theme active'}</div>
                </div>
              </div>
              <button
                type="button"
                id="id-theme-toggle-btn"
                role="switch"
                aria-checked="${isDark ? 'true' : 'false'}"
                class="relative inline-flex h-7 w-12 items-center rounded-full transition-colors ${isDark ? 'bg-indigo-600' : 'bg-slate-300 dark:bg-slate-700'}"
              >
                <span class="inline-block h-5 w-5 transform rounded-full bg-white shadow-sm transition-transform ${isDark ? 'translate-x-6' : 'translate-x-1'}"></span>
              </button>
            </div>
          </div>
        ` : ''}

        <!-- Bottom Action Buttons -->
        <div class="flex items-center gap-2.5 pt-1">
          ${stepIdx > 0 ? `
            <button type="button" id="id-back-btn" class="px-4 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-sm transition">
              ← Back
            </button>
          ` : ''}

          ${!isLastStep ? `
            <button type="button" id="id-next-btn" class="flex-1 py-3.5 px-5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-extrabold text-sm shadow-sm transition">
              Next: ${steps[stepIdx + 1].label.replace(/^\d+\.\s*/, '')} →
            </button>
          ` : `
            <button type="button" id="id-submit-btn" class="flex-1 py-3.5 px-5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-extrabold text-sm shadow-sm transition">
              ${profileOnly ? 'Save Profile' : mode === 'create' ? 'Create Room & Enter →' : selectedSeatId !== '__new__' ? 'Claim Seat & Join →' : 'Join Room →'}
            </button>
          `}
        </div>
      </div>
    `, { maxWidth: 'max-w-md' });

    const captureFields = () => {
      const nEl = document.getElementById('id-name-input');
      const eEl = document.getElementById('id-email-input');
      if (nEl) nameVal = nEl.value;
      if (eEl) emailVal = eEl.value;
    };

    document.getElementById('id-close-btn').addEventListener('click', closeModal);

    document.querySelectorAll('.id-step-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        captureFields();
        const target = btn.getAttribute('data-step-id');
        if (currentStep === 'seat' && target !== 'seat') {
          applySeatSelectionToFields(selectedSeatId);
        }
        currentStep = target;
        renderIdentityModal();
      });
    });

    const backBtn = document.getElementById('id-back-btn');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        captureFields();
        currentStep = steps[stepIdx - 1].id;
        renderIdentityModal();
      });
    }

    const nextBtn = document.getElementById('id-next-btn');
    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        captureFields();
        if (currentStep === 'seat') {
          applySeatSelectionToFields(selectedSeatId);
        }
        if (currentStep === 'name' && !profileOnly) {
          if (!nameVal.trim()) {
            showToast('Please enter your display name.', 'warning');
            return;
          }
          if (authTab === 'email') {
            const em = emailVal.trim().toLowerCase();
            if (!em || !em.includes('@')) {
              showToast('Please enter a valid email address or switch to Guest.', 'warning');
              return;
            }
          }
        }
        currentStep = steps[stepIdx + 1].id;
        renderIdentityModal();
      });
    }

    document.querySelectorAll('.id-seat-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        selectedSeatId = btn.getAttribute('data-claim-seat');
        appliedSeatId = null;
        applySeatSelectionToFields(selectedSeatId);
        renderIdentityModal();
      });
    });

    document.querySelectorAll('.id-tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        captureFields();
        authTab = btn.getAttribute('data-auth-tab');
        renderIdentityModal();
      });
    });

    const lookupBtn = document.getElementById('id-lookup-email-btn');
    if (lookupBtn) {
      lookupBtn.addEventListener('click', async () => {
        captureFields();
        const em = emailVal.trim().toLowerCase();
        if (!em || !em.includes('@')) {
          showToast('Enter a valid email address first.', 'warning');
          return;
        }
        const pid = normalizeEmailToProfileId(em);
        const existing = await fetchProfileById(pid);
        if (existing) {
          nameVal = existing.name || nameVal;
          avatarVal = getAvatarObj(existing.avatar || avatarVal).emoji;
          state.currentUser.favorites = Array.isArray(existing.favorites) ? existing.favorites : [];
          showToast(`Welcome back, ${nameVal}!`, 'success');
          renderIdentityModal();
        } else {
          showToast('No saved profile yet — we will create one when you continue.', 'info');
        }
      });
    }

    if (currentStep === 'piece') {
      bindEmojiPickerEvents({
        prefix: 'id-ep',
        initialValue: avatarVal,
        onSelect: (emojiStr) => {
          avatarVal = emojiStr;
        },
      });
    }

    const modalThemeBtn = document.getElementById('id-theme-toggle-btn');
    if (modalThemeBtn) {
      modalThemeBtn.addEventListener('click', () => {
        applyTheme(state.theme === 'dark' ? 'light' : 'dark');
        persistUserPreferences();
        renderIdentityModal();
      });
    }

    const submitBtn = document.getElementById('id-submit-btn');
    if (submitBtn) {
      submitBtn.addEventListener('click', async () => {
        captureFields();
        const cleanName = nameVal.trim();
        if (!cleanName && !profileOnly) {
          currentStep = 'name';
          renderIdentityModal();
          showToast('Please enter your display name.', 'warning');
          return;
        }

        let profileId = state.currentUser.profileId || null;
        let cleanEmail = state.currentUser.email || '';
        const isGuest = authTab === 'guest';

        if (!isGuest && (cleanName || emailVal.trim())) {
          cleanEmail = emailVal.trim().toLowerCase();
          if (!cleanEmail || !cleanEmail.includes('@')) {
            currentStep = 'name';
            renderIdentityModal();
            showToast('Please enter a valid email address or switch to Guest.', 'warning');
            return;
          }
          profileId = normalizeEmailToProfileId(cleanEmail);
          const existing = await fetchProfileById(profileId);
          const mergedFavs = Array.from(new Set([
            ...(existing?.favorites || []),
            ...(state.currentUser.favorites || []),
          ]));
          state.currentUser.favorites = mergedFavs;
          await saveUserProfile({
            profileId,
            name: cleanName || state.currentUser.name || 'Player',
            email: cleanEmail,
            avatar: avatarVal,
            favorites: mergedFavs,
          });
        } else if (isGuest) {
          profileId = null;
          cleanEmail = '';
        }

        if (cleanName) state.currentUser.name = cleanName;
        state.currentUser.email = cleanEmail;
        state.currentUser.profileId = profileId;
        state.currentUser.avatar = avatarVal;
        state.currentUser.isGuest = isGuest;
        await persistUserPreferences();

        if (profileOnly) {
          if (state.currentRoom) {
            const updated = JSON.parse(JSON.stringify(state.currentRoom));
            const mySeat = (updated.players || []).find((p) => p.claimedByUid === state.currentUser.uid);
            if (mySeat) {
              if (cleanName) mySeat.name = cleanName;
              mySeat.avatar = avatarVal;
              mySeat.profileId = profileId;
              mySeat.email = cleanEmail;
              await saveRoom(updated);
            }
          }
          closeModal();
          updateHeaderUI();
          showToast('Profile updated!', 'success');
          return;
        }

        try {
          if (mode === 'create') {
            let code = generateRoomCode();
            for (let tries = 0; tries < 5; tries++) {
              const exists = await fetchRoom(code);
              if (!exists) break;
              code = generateRoomCode();
            }
            const newRoom = {
              code,
              hostUid: state.currentUser.uid,
              status: 'lobby',
              settings: { whoCanScore: 'anyone' },
              players: [
                {
                  seatId: generateId('seat'),
                  name: cleanName,
                  avatar: avatarVal,
                  claimedByUid: state.currentUser.uid,
                  profileId,
                  email: cleanEmail,
                },
              ],
              activeMatch: null,
              createdAt: Date.now(),
              updatedAt: Date.now(),
            };
            await saveRoom(newRoom);
            closeModal();
            subscribeRoom(code);
            showToast(`Room ${code} created! Share the code or invite link.`, 'success');
          } else if (mode === 'join' && targetRoom) {
            const freshRoom = (await fetchRoom(targetRoom.code)) || targetRoom;
            const updated = JSON.parse(JSON.stringify(freshRoom));
            updated.players = updated.players || [];

            if (selectedSeatId !== '__new__') {
              const seat = updated.players.find((p) => p.seatId === selectedSeatId);
              if (seat && !seat.claimedByUid) {
                seat.name = cleanName;
                seat.avatar = avatarVal;
                seat.claimedByUid = state.currentUser.uid;
                seat.profileId = profileId;
                seat.email = cleanEmail;
              } else {
                updated.players.push({
                  seatId: generateId('seat'),
                  name: cleanName,
                  avatar: avatarVal,
                  claimedByUid: state.currentUser.uid,
                  profileId,
                  email: cleanEmail,
                });
              }
            } else {
              updated.players.push({
                seatId: generateId('seat'),
                name: cleanName,
                avatar: avatarVal,
                claimedByUid: state.currentUser.uid,
                profileId,
                email: cleanEmail,
              });
            }

            await saveRoom(updated);
            closeModal();
            subscribeRoom(updated.code);
            showToast(`Joined Room ${updated.code}!`, 'success');
          }
        } catch (err) {
          console.error('Error creating/joining room:', err);
          showToast('Something went wrong saving your seat. Please try again.', 'error');
        }
      });
    }
  };

  renderIdentityModal();
}

    // MODAL 2: GAME DETAIL (Start Game, See Rules, See History)
    function openGameDetailModal(game) {
      const host = isHost();
      const isFav = (state.currentUser.favorites || []).includes(game.id);

      openModal(`
        <div>
          <div class="h-36 bg-gradient-to-br ${game.gradient} p-5 flex flex-col justify-between text-white relative">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-xl bg-black/25 backdrop-blur-sm text-xs font-bold">${escapeHtml(game.category)}</span>
              <button id="gd-close-btn" class="w-8 h-8 rounded-xl bg-black/25 hover:bg-black/40 font-bold text-sm">✕</button>
            </div>
            <div class="flex items-end justify-between">
              <div>
                <h2 class="text-2xl font-black tracking-tight">${escapeHtml(game.name)}</h2>
                <p class="text-xs text-white/90">${escapeHtml(game.playersLabel)}</p>
              </div>
              <div class="text-5xl">${game.emoji}</div>
            </div>
          </div>

          <div class="p-5 sm:p-6 space-y-4">

            <div class="space-y-2.5">
              ${host ? `
                <button id="gd-start-btn" class="w-full py-3.5 px-5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-extrabold text-sm shadow-sm transition">
                  ▶ Start Game (Configure Rules)
                </button>
              ` : `
                <div class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-center text-xs font-semibold text-slate-500 dark:text-slate-400">
                  Only the room host can start a new game.
                </div>
              `}

              <div class="grid grid-cols-2 gap-2.5">
                <button id="gd-rules-btn" class="py-3 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-xs sm:text-sm transition">
                  📖 See Rules
                </button>
                <button id="gd-history-btn" class="py-3 px-4 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-xs sm:text-sm transition">

                </button>
              </div>

              <button id="gd-fav-btn" class="w-full py-2.5 px-4 rounded-2xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300 transition">
                ${isFav ? '★ Saved in Your Favorites (Tap to Remove)' : '☆ Add to Your Favorites'}
              </button>
            </div>
          </div>
        </div>
      `, { maxWidth: 'max-w-md' });

      document.getElementById('gd-close-btn').addEventListener('click', closeModal);

      const startBtn = document.getElementById('gd-start-btn');
      if (startBtn) {
        startBtn.addEventListener('click', () => openGameRulesSetupModal(game));
      }

      document.getElementById('gd-rules-btn').addEventListener('click', () => {
        openRulesInfoModal(game, game.defaultRules);
      });

      document.getElementById('gd-history-btn').addEventListener('click', () => {
        openGameHistoryModal(game);
      });

      document.getElementById('gd-fav-btn').addEventListener('click', async () => {
        await toggleFavoriteGame(game.id);
        openGameDetailModal(game);
      });
    }

                  </div>
                  <div class="col-span-2">
                    <label for="rs-yz-bonus" class="block text-[11px] font-bold text-slate-600 dark:text-slate-300 mb-1">Extra Yahtzee Bonus (+pts)</label>
                    <input id="rs-yz-bonus" type="number" min="0" max="1000" value="${currentRules.yahtzeeBonus}" class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-sm" />
                  </div>
                </div>
              </div>
            ` : ''}
          </div>

          <div class="flex gap-2.5 pt-1">
            <button id="rs-cancel-btn" class="flex-1 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">Cancel</button>
            <button id="rs-confirm-btn" class="flex-1 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm shadow-sm transition">
              ${editingActiveMatch ? 'Save Rules' : 'Start Match →'}
            </button>
          </div>
        </div>
      `, { maxWidth: 'max-w-md' });

      document.getElementById('rs-close-btn').addEventListener('click', closeModal);
      document.getElementById('rs-cancel-btn').addEventListener('click', closeModal);

      document.querySelectorAll('.rs-preset-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const inp = document.getElementById('rs-target-score');
          if (inp) inp.value = btn.getAttribute('data-preset-target');
        });
      });

      document.querySelectorAll('.rs-holes-preset-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const inp = document.getElementById('rs-golf-holes');
          if (inp) inp.value = btn.getAttribute('data-preset-holes');
        });
      });

      document.querySelectorAll('.rs-yz-preset-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const inp = document.getElementById('rs-yz-games');
          if (inp) inp.value = btn.getAttribute('data-preset-yz-games');
        });
      });

      document.getElementById('rs-confirm-btn').addEventListener('click', async () => {
        let rules = {};
        if (isGin) {
          const targetScore = Math.max(10, parseInt(document.getElementById('rs-target-score').value, 10) || 100);
          const ginBonus = Math.max(0, parseInt(document.getElementById('rs-gin-bonus').value, 10) || 0);
          const undercutBonus = Math.max(0, parseInt(document.getElementById('rs-undercut-bonus').value, 10) || 0);
          rules = { targetScore, ginBonus, undercutBonus };
        } else if (isScrabble) {
          rules = { doubleTileTransfer: Boolean(document.getElementById('rs-double-transfer').checked) };
        } else if (isGolf) {
          const totalHoles = Math.min(36, Math.max(1, parseInt(document.getElementById('rs-golf-holes').value, 10) || 9));
          rules = { totalHoles };
        } else if (isYahtzee) {
          const numGames = Math.min(12, Math.max(1, parseInt(document.getElementById('rs-yz-games').value, 10) || 1));
          const fullHouse = Math.max(0, parseInt(document.getElementById('rs-yz-fh').value, 10) || 0);
          const smallStraight = Math.max(0, parseInt(document.getElementById('rs-yz-sm').value, 10) || 0);
          const largeStraight = Math.max(0, parseInt(document.getElementById('rs-yz-lg').value, 10) || 0);
          const yahtzee = Math.max(0, parseInt(document.getElementById('rs-yz-ytz').value, 10) || 0);
          const yahtzeeBonus = Math.max(0, parseInt(document.getElementById('rs-yz-bonus').value, 10) || 0);
          rules = { numGames, fullHouse, smallStraight, largeStraight, yahtzee, yahtzeeBonus };
        }

        closeModal();

        if (editingActiveMatch && state.currentRoom?.activeMatch) {
          const updated = JSON.parse(JSON.stringify(state.currentRoom));
          updated.activeMatch.rules = rules;
          if (isYahtzee) {
            updated.activeMatch.yahtzeeSheets = updated.activeMatch.yahtzeeSheets || {};
            (updated.players || []).forEach((p) => {
              updated.activeMatch.yahtzeeSheets[p.seatId] = updated.activeMatch.yahtzeeSheets[p.seatId] || {};
              for (let i = 0; i < rules.numGames; i++) {
                if (!updated.activeMatch.yahtzeeSheets[p.seatId][String(i)]) {
                  updated.activeMatch.yahtzeeSheets[p.seatId][String(i)] = createEmptyYahtzeeGame();
                }
              }
            });
          }
          await saveRoom(updated);
          showToast('Match rules updated!', 'success');
        } else {
          await startNewMatchInRoom(game, rules);
        }
      });
    }

    // MODAL 4: RULES OVERVIEW
    function openRulesInfoModal(game, activeRules = null) {
      const rules = { ...game.defaultRules, ...(activeRules || {}) };
      const summaryLine =
        game.id === 'gin-rummy'
          ? `Current Setting: Playing to ${rules.targetScore} points · Gin +${rules.ginBonus} · Undercut +${rules.undercutBonus}`
          : game.id === 'golf'
            ? `Current Setting: ${rules.totalHoles} holes · Lowest total score wins`
            : game.id === 'yahtzee'
              ? `Current Setting: ${rules.numGames} ${rules.numGames === 1 ? 'game' : 'games'} · FH ${rules.fullHouse} · Sm ${rules.smallStraight} · Lg ${rules.largeStraight} · Ytz ${rules.yahtzee} · Bonus +${rules.yahtzeeBonus}`
              : `Current Setting: No point cap · ${rules.doubleTileTransfer ? '2× OUT Tile Bonus' : 'Classic OUT Tile Transfer (Subtract & Add)'}`;

      openModal(`
        <div class="p-5 sm:p-6 space-y-4">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
              <span class="text-2xl">${game.emoji}</span>
              <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">${escapeHtml(game.name)} Rules</h2>

          </div>

          <div class="p-3.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200/80 dark:border-indigo-800/70 text-xs font-bold text-indigo-800 dark:text-indigo-200">
            ${escapeHtml(summaryLine)}

          <ul class="space-y-2.5 text-sm text-slate-600 dark:text-slate-300">
            ${(game.rulesOverview || []).map((line, i) => `
              <li class="flex items-start gap-2.5">
                <span class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-extrabold text-xs flex items-center justify-center shrink-0 mt-0.5">${i + 1}</span>
                <span>${escapeHtml(line)}</span>
              </li>
            `).join('')}
          </ul>

          <button id="ri-done-btn" class="w-full py-3 rounded-2xl bg-slate-900 dark:bg-indigo-600 text-white font-bold text-sm">Got It</button>
        </div>
      `, { maxWidth: 'max-w-md' });

      document.getElementById('ri-close-btn').addEventListener('click', closeModal);
      document.getElementById('ri-done-btn').addEventListener('click', closeModal);
    }

    // MODAL 5: GAME HISTORY (Filtered to Host & Seated Players in Room)
    function openGameHistoryModal(game) {
      const room = state.currentRoom;
      const roomUids = new Set([
        room?.hostUid,
        ...((room?.players || []).map((p) => p.claimedByUid).filter(Boolean)),
        state.currentUser.uid,
      ].filter(Boolean));
      const roomPids = new Set([
        ...((room?.players || []).map((p) => p.profileId).filter(Boolean)),
        state.currentUser.profileId,
      ].filter(Boolean));

      const relevant = (state.matchHistory || []).filter((m) => {
        if (m.gameId !== game.id) return false;
        const uids = m.participantUids || [];
        const pids = m.participantProfileIds || [];
        return uids.some((u) => roomUids.has(u)) || pids.some((p) => roomPids.has(p)) || roomUids.has(m.hostUid);
      });

      openModal(`
        <div class="p-5 sm:p-6 space-y-4">
          <div class="flex items-center justify-between gap-2">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">Table Match History</span>
              <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">${game.emoji} ${escapeHtml(game.name)}</h2>
            </div>
            <button id="gh-close-btn" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">✕</button>
          </div>

          ${relevant.length === 0 ? `
            <div class="py-10 text-center space-y-2">
              <div class="text-3xl">📜</div>
              <div class="font-bold text-sm text-slate-700 dark:text-slate-200">No logged ${escapeHtml(game.name)} matches yet</div>
              <p class="text-xs text-slate-400">Completed games played by you or anyone in this room will appear here.</p>
            </div>
          ` : `
            <div class="space-y-2.5 max-h-[55vh] overflow-y-auto pr-0.5">
              ${relevant.map((m) => `
                <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xs font-extrabold text-amber-600 dark:text-amber-400">🏆 ${escapeHtml((m.winnerNames || []).join(' & ') || 'Finished')}</span>
                    <span class="text-[11px] text-slate-400">${formatShortDate(m.finishedAt)}</span>
                  </div>
                  <div class="flex flex-wrap gap-1.5">
                    ${(m.standings || []).map((s, idx) => `
                      <span class="px-2 py-1 rounded-xl text-xs font-bold ${
                        idx === 0
                          ? 'bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300'
                          : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700'
                      }">
                        ${getAvatarObj(s.avatar).emoji} ${escapeHtml(s.name)}: ${s.total}
                      </span>

                  </div>
                </div>
              `).join('')}
