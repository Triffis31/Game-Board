          <button id="gh-done-btn" class="w-full py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">Close</button>
        </div>
      `, { maxWidth: 'max-w-md' });

      document.getElementById('gh-close-btn').addEventListener('click', closeModal);
      document.getElementById('gh-done-btn').addEventListener('click', closeModal);
    }

    // MODAL 6: LOG OR EDIT ROUND (Tactile Number Pad + Smart Collaborative Merge)
    function openLogRoundModal(existingRound = null, focusSeatId = null) {
  const room = state.currentRoom;
  const match = room?.activeMatch;
  if (!room || !match) return;
  const players = room.players || [];
  if (players.length === 0) return;

  const isEdit = Boolean(existingRound);
  const roundNumber = isEdit
    ? (match.rounds || []).findIndex((r) => r.roundId === existingRound.roundId) + 1
    : (match.rounds || []).length + 1;
  const isGin = match.gameId === 'gin-rummy';
  const isScrabble = match.gameId === 'scrabble';
  const isGolf = match.gameId === 'golf';
  const unitLabel = isGolf ? 'Hole' : 'Round';
  const ginBonus = match.rules?.ginBonus ?? 25;
  const undercutBonus = match.rules?.undercutBonus ?? 25;

  const exprMap = {};
  const touchedSeats = new Set();
  players.forEach((p) => {
    if (isEdit) {
      const val = existingRound.scores?.[p.seatId];
      exprMap[p.seatId] = val !== null && val !== undefined ? String(val).replace('-', '−') : '';
    } else {
      exprMap[p.seatId] = '';
    }
  });

  // Focus requested seat -> current user's seat -> first player
  let activeIdx = 0;
  if (focusSeatId) {
    const idx = players.findIndex((p) => p.seatId === focusSeatId);
    if (idx !== -1) activeIdx = idx;
  } else {
    const myIdx = players.findIndex((p) => p.claimedByUid && p.claimedByUid === state.currentUser.uid);
    if (myIdx !== -1) activeIdx = myIdx;
  }

  let noteText = isEdit ? (existingRound.note || '') : '';
  let noteTouched = false;
  let showNoteField = Boolean(noteText);

  const renderLogRoundUI = () => {
    const activePlayer = players[activeIdx];
    openModal(`
      <div class="p-4 sm:p-6 space-y-4">
        <div class="flex items-center justify-between gap-2">
          <div>
            <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
              ${escapeHtml(match.gameName)}
            </span>
            <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">
              ${isEdit ? `${unitLabel} ${roundNumber} Scores` : isScrabble ? 'Log Points' : `Log ${unitLabel} ${roundNumber}`}
            </h2>
          </div>
          <button type="button" id="lr-close-btn" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-sm">✕</button>
        </div>

        <!-- Player Score Selector Rows -->
        <div class="space-y-2 max-h-[30vh] overflow-y-auto pr-0.5">
          ${players.map((p, idx) => {
            const av = getAvatarObj(p.avatar);
            const isActive = idx === activeIdx;
            const expr = exprMap[p.seatId] || '';
            const evalVal = expr ? evaluateScoreExpression(expr) : null;
            const hasExprOps = /[+−×]/.test(expr.slice(1));
            const statusText = isScrabble && !isEdit
              ? (isActive ? 'Entering points' : !expr ? 'Tap to enter' : 'Ready')
              : (isActive ? 'Entering score' : !expr ? 'Pending' : 'Entered');
            return `
              <button
                type="button"
                data-select-player-idx="${idx}"
                class="lr-player-row w-full text-left p-3 rounded-2xl border-2 transition flex items-center justify-between gap-3 ${
                  isActive
                    ? 'border-indigo-600 dark:border-indigo-400 bg-indigo-50/70 dark:bg-indigo-950/50 shadow-sm'
                    : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 hover:border-slate-300 dark:hover:border-slate-700'
                }"
              >
                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="w-8 h-8 rounded-xl flex items-center justify-center text-base shrink-0 ${av.color}">${av.emoji}</span>
                  <div class="min-w-0">
                    <div class="font-bold text-sm text-slate-900 dark:text-white truncate">${escapeHtml(p.name)}</div>
                    <div class="text-[10px] font-bold uppercase tracking-wider ${
                      isActive
                        ? 'text-indigo-600 dark:text-indigo-400'
                        : !expr
                        ? 'text-slate-400'
                        : 'text-emerald-600 dark:text-emerald-400'
                    }">
                      ${statusText}
                    </div>
                  </div>
                </div>
                <div class="text-right shrink-0">
                  <div class="font-extrabold text-xl tabular-nums leading-tight ${
                    evalVal !== null && Number.isNaN(evalVal)
                      ? 'text-rose-500'
                      : isActive
                      ? 'text-indigo-700 dark:text-indigo-300'
                      : 'text-slate-900 dark:text-white'
                  }">
                    ${expr ? escapeHtml(expr) : '<span class="text-slate-400 dark:text-slate-500">—</span>'}
                  </div>
                  ${hasExprOps ? `
                    <div class="text-[11px] font-bold tabular-nums ${Number.isNaN(evalVal) ? 'text-rose-500' : 'text-emerald-600 dark:text-emerald-400'}">
                      ${Number.isNaN(evalVal) ? 'Check math' : `= ${evalVal}`}
                    </div>
                  ` : ''}
                </div>
              </button>
            `;
          }).join('')}
        </div>

        <!-- Quick Bonus Buttons + Note Toggle -->
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <div class="flex items-center gap-1.5 flex-wrap">
            ${isGin && ginBonus > 0 ? `<button type="button" data-quick-bonus="${ginBonus}" class="lr-bonus-btn px-2.5 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 text-xs font-bold text-indigo-700 dark:text-indigo-300 active:scale-95 transition">+${ginBonus} Gin</button>` : ''}
            ${isGin && undercutBonus > 0 ? `<button type="button" data-quick-bonus="${undercutBonus}" class="lr-bonus-btn px-2.5 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 text-xs font-bold text-emerald-700 dark:text-emerald-300 active:scale-95 transition">+${undercutBonus} Undercut</button>` : ''}
            ${isScrabble ? `<button type="button" data-quick-bonus="50" class="lr-bonus-btn px-2.5 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 text-xs font-bold text-emerald-700 dark:text-emerald-300 active:scale-95 transition">+50 Bingo</button>` : ''}
            ${isScrabble && !isEdit ? `<button type="button" id="lr-switch-out-btn" class="px-2.5 py-1.5 rounded-xl bg-amber-100 dark:bg-amber-950/60 border border-amber-300 dark:border-amber-800 text-xs font-bold text-amber-800 dark:text-amber-300 active:scale-95 transition">🏁 OUT</button>` : ''}
            ${isGolf ? `<span class="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400">Tip: tap ± for negative scores</span>` : ''}
          </div>
          <button type="button" id="lr-toggle-note-btn" class="text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">
            ${showNoteField ? 'Hide Note' : `+ Add ${unitLabel} Note`}
          </button>
        </div>

        ${showNoteField ? `
          <input
            id="lr-note"
            type="text"
            maxlength="60"
            value="${escapeHtml(noteText)}"
            placeholder="${isScrabble ? 'e.g., QUARTZ on triple word' : isGolf ? 'e.g., Pair of Kings + Joker' : 'e.g., Alex went Gin!'}"
            class="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        ` : ''}

        ${buildNumberPadHtml({ nextLabel: 'Save ✓', showSignToggle: isGolf })}
      </div>
    `, { maxWidth: 'max-w-md' });

    document.getElementById('lr-close-btn').addEventListener('click', closeModal);

    const captureNote = () => {
      const nInp = document.getElementById('lr-note');
      if (nInp && nInp.value !== noteText) {
        noteText = nInp.value;
        noteTouched = true;
      }
    };

    document.querySelectorAll('.lr-player-row').forEach((row) => {
      row.addEventListener('click', () => {
        captureNote();
        activeIdx = parseInt(row.getAttribute('data-select-player-idx'), 10);
        renderLogRoundUI();
      });
    });

    document.querySelectorAll('.lr-bonus-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        captureNote();
        const bonus = btn.getAttribute('data-quick-bonus');
        const sid = activePlayer.seatId;
        const cur = exprMap[sid] || '';
        exprMap[sid] = cur ? `${cur}+${bonus}` : `${bonus}`;
        touchedSeats.add(sid);
        renderLogRoundUI();
      });
    });

    document.getElementById('lr-toggle-note-btn').addEventListener('click', () => {
      captureNote();
      showNoteField = !showNoteField;
      renderLogRoundUI();
      if (showNoteField) {
        const nInp = document.getElementById('lr-note');
        if (nInp) nInp.focus();
      }
    });

    const submitRound = async () => {
      captureNote();
      let hasInvalid = false;
      const enteredMap = {};
      players.forEach((p) => {
        const raw = (exprMap[p.seatId] || '').trim();
        if (!raw) {
          enteredMap[p.seatId] = null;
        } else {
          const parsed = evaluateScoreExpression(raw);
          if (Number.isNaN(parsed)) {
            hasInvalid = true;
          } else {
            enteredMap[p.seatId] = parsed;
          }
        }
      });

      if (hasInvalid) {
        showToast('Please fix the invalid math expression before saving.', 'error');
        return;
      }

      const anyEntered = Object.values(enteredMap).some((v) => v !== null);
      if (!isEdit && !anyEntered) {
        showToast(`Enter at least one score on the number pad (even 0) to log this ${unitLabel.toLowerCase()}.`, 'warning');
        return;
      }

      // Always pull the latest room from Firestore right before merging
      const latestRoom = (!isLocalFallback && fbUser && state.currentRoomCode)
        ? (await fetchRoom(state.currentRoomCode)) || state.currentRoom
        : state.currentRoom;

      const updated = JSON.parse(JSON.stringify(latestRoom));
      const latestRounds = updated.activeMatch.rounds || [];
      let targetRoundIndex = -1;

      if (isScrabble && !isEdit) {
        // Per-player turn slotting: never overwrites another player's score
        const seatsToLog = players.filter((p) => touchedSeats.has(p.seatId) && enteredMap[p.seatId] !== null);
        seatsToLog.forEach((p) => {
          let openRound = latestRounds.find(
            (r) => r.type === 'standard' && (r.scores?.[p.seatId] === null || r.scores?.[p.seatId] === undefined)
          );
          if (!openRound) {
            const blankScores = {};
            players.forEach((pl) => { blankScores[pl.seatId] = null; });
            openRound = {
              roundId: generateId('rnd'),
              type: 'standard',
              scores: blankScores,
              note: '',
              loggedBy: state.currentUser.name || 'Player',
              createdAt: Date.now(),
            };
            latestRounds.push(openRound);
          }
          openRound.scores[p.seatId] = enteredMap[p.seatId];
          if (noteTouched && noteText.trim()) openRound.note = noteText.trim();
        });
      } else {
        if (isEdit) {
          targetRoundIndex = latestRounds.findIndex((r) => r.roundId === existingRound.roundId);
        } else if (
          latestRounds.length >= roundNumber &&
          latestRounds[roundNumber - 1]?.type === 'standard'
        ) {
          targetRoundIndex = roundNumber - 1;
        }

        if (targetRoundIndex !== -1) {
          const target = latestRounds[targetRoundIndex];
          const mergedScores = { ...(target.scores || {}) };
          touchedSeats.forEach((sid) => {
            mergedScores[sid] = enteredMap[sid];
          });
          latestRounds[targetRoundIndex] = {
            ...target,
            scores: mergedScores,
            note: noteTouched ? noteText.trim() : (target.note || ''),
            editedBy: state.currentUser.name || 'Player',
          };
        } else {
          const newScores = {};
          players.forEach((p) => {
            newScores[p.seatId] = enteredMap[p.seatId];
          });
          latestRounds.push({
            roundId: generateId('rnd'),
            type: 'standard',
            scores: newScores,
            note: noteText.trim(),
            loggedBy: state.currentUser.name || 'Player',
            createdAt: Date.now(),
          });
        }
      }

      updated.activeMatch.rounds = latestRounds;
      closeModal();

      if (updated.activeMatch.gameId === 'gin-rummy') {
        const target = updated.activeMatch.rules?.targetScore || 100;
        const newTotals = computePlayerTotals(updated);
        const reached = Object.values(newTotals).some((v) => v >= target);
        if (reached) {
          await finalizeMatch(updated);
          return;
        }
      }

      if (updated.activeMatch.gameId === 'golf') {
        const totalHoles = Math.max(1, parseInt(updated.activeMatch.rules?.totalHoles, 10) || 9);
        if (latestRounds.length >= totalHoles) {
          const finalHole = latestRounds[totalHoles - 1];
          const allFilled = (updated.players || []).every(
            (p) => finalHole?.scores?.[p.seatId] !== null && finalHole?.scores?.[p.seatId] !== undefined
          );
          if (allFilled) {
            await finalizeMatch(updated);
            return;
          }
        }
      }

      await saveRoom(updated);
      showToast(
        isScrabble && !isEdit
          ? 'Points logged!'
          : targetRoundIndex !== -1
          ? `${unitLabel} ${roundNumber} updated!`
          : `${unitLabel} ${roundNumber} logged!`,
        'success'
      );
    };

    const handlePadPress = (key) => {
      captureNote();
      const sid = activePlayer.seatId;
      if (key === 'NEXT') {
        submitRound();
        return;
      }
      exprMap[sid] = applyNumberPadKey(exprMap[sid], key);
      touchedSeats.add(sid);
      renderLogRoundUI();
    };

    document.querySelectorAll('.np-key').forEach((btn) => {
      btn.addEventListener('click', () => handlePadPress(btn.getAttribute('data-np')));
    });

    const switchOutBtn = document.getElementById('lr-switch-out-btn');
    if (switchOutBtn) {
      switchOutBtn.addEventListener('click', () => openScrabbleOutModal());
    }

    activeModalKeydownHandler = (e) => {
      if (document.activeElement && document.activeElement.id === 'lr-note') return;
      if (/^[0-9]$/.test(e.key)) {
        e.preventDefault();
        handlePadPress(e.key);
      } else if (e.key === '+') {
        e.preventDefault();
        handlePadPress('+');
      } else if (e.key === '-') {
        e.preventDefault();
        handlePadPress('−');
      } else if (e.key === '*' && !isGolf) {
        e.preventDefault();
        handlePadPress('×');
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        handlePadPress('BACK');
      } else if (e.key === 'Enter') {
        e.preventDefault();
        handlePadPress('NEXT');
      } else if (e.key === 'Escape') {
        closeModal();
      }
    };
    window.addEventListener('keydown', activeModalKeydownHandler);
  };

  renderLogRoundUI();
}

    // MODAL 7: SCRABBLE "OUT" ENDGAME TILE-TRANSFER CALCULATOR
    function openScrabbleOutModal() {
      const room = state.currentRoom;
      const match = room?.activeMatch;
      if (!room || !match) return;
      const players = room.players || [];
      if (players.length < 2) {
        showToast('Add at least 2 players before using Scrabble OUT.', 'warning');
        return;
      }

      const doubleTransfer = Boolean(match.rules?.doubleTileTransfer);
      let outSeatId = players[0].seatId;
      const remainingExpr = {};
      players.forEach((p) => {
        remainingExpr[p.seatId] = '';
      });
      let activeOtherIdx = 0;

      const renderOutModal = () => {
        const otherPlayers = players.filter((p) => p.seatId !== outSeatId);
        if (activeOtherIdx >= otherPlayers.length) activeOtherIdx = 0;
        const activeOther = otherPlayers[activeOtherIdx];
        const isLastOther = activeOtherIdx === otherPlayers.length - 1;

        let totalRemaining = 0;
        otherPlayers.forEach((p) => {
          const val = evaluateScoreExpression(remainingExpr[p.seatId] || '0');
          if (!Number.isNaN(val) && val > 0) totalRemaining += val;
        });

        const outPlayer = players.find((p) => p.seatId === outSeatId);
        const outBonus = doubleTransfer ? totalRemaining * 2 : totalRemaining;

        openModal(`
          <div class="p-4 sm:p-6 space-y-4">
            <div class="flex items-center justify-between gap-2">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400">Scrabble Endgame</span>
                <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">🏁 Player Went OUT</h2>
              </div>
              <button type="button" id="so-close-btn" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">✕</button>
            </div>

            <!-- Step 1: Who Went Out -->
            <div class="space-y-1.5">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">1. Who used their last tile?</div>
              <div class="grid grid-cols-2 gap-2">
                ${players.map((p) => {
                  const av = getAvatarObj(p.avatar);
                  const active = p.seatId === outSeatId;
                  return `
                    <button type="button" data-out-seat="${escapeHtml(p.seatId)}" class="so-out-seat-btn p-2.5 rounded-2xl border-2 flex items-center gap-2 text-left transition ${
                      active
                        ? 'border-amber-500 bg-amber-50 dark:bg-amber-950/40'
                        : 'border-slate-200 dark:border-slate-700 hover:border-slate-300'
                    }">
                      <span class="text-lg">${av.emoji}</span>
                      <span class="font-bold text-sm truncate text-slate-900 dark:text-white">${escapeHtml(p.name)}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Step 2: Enter Remaining Tile Points for Other Players -->
            <div class="space-y-1.5">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                2. Enter remaining tile points on each opponent's rack
              </div>
              <div class="space-y-2 max-h-[24vh] overflow-y-auto pr-0.5">
                ${otherPlayers.map((p, idx) => {
                  const av = getAvatarObj(p.avatar);
                  const isActive = idx === activeOtherIdx;
                  const expr = remainingExpr[p.seatId] || '';
                  const parsed = expr ? evaluateScoreExpression(expr) : 0;
                  return `
                    <button
                      type="button"
                      data-other-idx="${idx}"
                      class="so-other-row w-full text-left p-3 rounded-2xl border-2 transition flex items-center justify-between gap-3 ${
                        isActive
                          ? 'border-indigo-600 dark:border-indigo-400 bg-indigo-50/70 dark:bg-indigo-950/50'
                          : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50'
                      }"
                    >
                      <div class="flex items-center gap-2.5 min-w-0">
                        <span class="w-8 h-8 rounded-xl flex items-center justify-center text-base shrink-0 ${av.color}">${av.emoji}</span>
                        <div class="min-w-0">
                          <div class="font-bold text-sm text-slate-900 dark:text-white truncate">${escapeHtml(p.name)}</div>
                          <div class="text-[10px] font-bold text-rose-500">
                            ${doubleTransfer ? 'No deduction (2× rule)' : `Will subtract −${Number.isNaN(parsed) ? 0 : Math.max(0, parsed)} pts`}
                          </div>
                        </div>
                      </div>
                      <div class="font-extrabold text-xl tabular-nums ${Number.isNaN(parsed) ? 'text-rose-500' : 'text-slate-900 dark:text-white'}">
                        ${expr ? escapeHtml(expr) : '<span class="text-slate-400">0</span>'}
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Live Transfer Preview -->
            <div class="p-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/70 flex items-center justify-between text-xs font-bold">
              <span class="text-emerald-800 dark:text-emerald-300">${escapeHtml(outPlayer?.name || 'Player')} receives:</span>
              <span class="text-base font-black text-emerald-700 dark:text-emerald-300 tabular-nums">+${outBonus} pts</span>
            </div>

            ${buildNumberPadHtml({ nextLabel: isLastOther ? 'Save ✓' : 'Next ↵' })}
          </div>
        `, { maxWidth: 'max-w-md' });

        document.getElementById('so-close-btn').addEventListener('click', closeModal);

        document.querySelectorAll('.so-out-seat-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            outSeatId = btn.getAttribute('data-out-seat');
            activeOtherIdx = 0;
            renderOutModal();
          });
        });

        document.querySelectorAll('.so-other-row').forEach((row) => {
          row.addEventListener('click', () => {
            activeOtherIdx = parseInt(row.getAttribute('data-other-idx'), 10);
            renderOutModal();
          });
        });

        const finalizeOut = async () => {
          const deltas = {};
          let sumTiles = 0;

          for (const p of otherPlayers) {
            const raw = (remainingExpr[p.seatId] || '').trim();
            const val = raw ? evaluateScoreExpression(raw) : 0;
            if (Number.isNaN(val) || val < 0) {
              showToast(`Check ${p.name}'s remaining tile score.`, 'error');
              return;
            }
            sumTiles += val;
            deltas[p.seatId] = doubleTransfer ? 0 : -val;
          }

          deltas[outSeatId] = doubleTransfer ? sumTiles * 2 : sumTiles;

          const updated = JSON.parse(JSON.stringify(state.currentRoom));
          updated.activeMatch.rounds = updated.activeMatch.rounds || [];
          updated.activeMatch.rounds.push({
            roundId: generateId('rnd_out'),
            type: 'scrabble-out',
            scores: deltas,
            note: `${outPlayer?.name || 'Player'} went OUT`,
            loggedBy: state.currentUser.name || 'Player',
            createdAt: Date.now(),
          });

          closeModal();
          await finalizeMatch(updated);
        };

        const handlePad = (key) => {
          if (!activeOther) return;
          if (key === 'NEXT') {
            if (activeOtherIdx < otherPlayers.length - 1) {
              activeOtherIdx += 1;
              renderOutModal();
            } else {
              finalizeOut();
            }
            return;
          }
          remainingExpr[activeOther.seatId] = applyNumberPadKey(remainingExpr[activeOther.seatId], key);
          renderOutModal();
        };

        document.querySelectorAll('.np-key').forEach((btn) => {
          btn.addEventListener('click', () => handlePad(btn.getAttribute('data-np')));
        });

        activeModalKeydownHandler = (e) => {
          if (/^[0-9]$/.test(e.key)) {
            e.preventDefault();
            handlePad(e.key);
          } else if (e.key === '+') {
            e.preventDefault();
            handlePad('+');
          } else if (e.key === '-') {
            e.preventDefault();
            handlePad('−');
          } else if (e.key === '*') {
            e.preventDefault();
            handlePad('×');
          } else if (e.key === 'Backspace') {
            e.preventDefault();
            handlePad('BACK');
          } else if (e.key === 'Enter') {
            e.preventDefault();
            handlePad('NEXT');
          } else if (e.key === 'Escape') {
            closeModal();
          }
        };
        window.addEventListener('keydown', activeModalKeydownHandler);
      };

      renderOutModal();
    }

            } else if (e.key === '+') {
              e.preventDefault();
              handlePad('+');
            } else if (e.key === '-') {
              e.preventDefault();
              handlePad('−');
            } else if (e.key === '*') {
              e.preventDefault();
              handlePad('×');
            } else if (e.key === 'Backspace') {
              e.preventDefault();
              handlePad('BACK');
            } else if (e.key === 'Enter') {
              e.preventDefault();
              handlePad('NEXT');
            } else if (e.key === 'Escape') {
              closeModal();
            }
          };
          window.addEventListener('keydown', activeModalKeydownHandler);
        }
      };

      renderLowerModal();
    }

    // MODAL 7D: YAHTZEE EXTRA BONUS CUSTOM OVERRIDE
    function openYahtzeeBonusModal(seatId, gameIdx) {
      const room = state.currentRoom;
      const match = room?.activeMatch;
      if (!room || !match) return;

      const rules = match.rules || {};
      const bonusUnit = getYahtzeeBonusUnit(rules);
      const sheet = getYahtzeeGameSheet(match, seatId, gameIdx);
      const stats = computeYahtzeeGameStats(sheet, rules);
      let expr = stats.yahtzeeBonusTotal > 0 ? String(stats.yahtzeeBonusTotal) : '';

      const renderBonusModal = () => {
        const evalVal = expr ? evaluateScoreExpression(expr) : 0;

        openModal(`
          <div class="p-5 sm:p-6 space-y-4">
            <div class="flex items-center justify-between gap-2">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400">
                  Game ${gameIdx + 1} · Default +${bonusUnit} each
                </span>
                <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">Extra Yahtzee Bonus</h2>
              </div>
              <button type="button" id="yzb-close-btn" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">✕</button>
            </div>

            <div class="p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border-2 border-amber-400 flex items-center justify-between">
              <span class="text-xs font-bold text-amber-800 dark:text-amber-200">Total Bonus Points</span>
              <span class="text-2xl font-black tabular-nums ${Number.isNaN(evalVal) ? 'text-rose-500' : 'text-amber-900 dark:text-amber-100'}">
                ${expr ? escapeHtml(expr) : '0'}
              </span>
            </div>

            <div class="flex items-center gap-1.5 flex-wrap">
              ${[1, 2, 3].map((n) => `
                <button type="button" data-yzb-mult="${n}" class="yzb-mult-btn px-3 py-1.5 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-900 dark:text-amber-200 text-xs font-bold">
                  ×${n} (+${n * bonusUnit})
                </button>
              `).join('')}
              <button type="button" id="yzb-reset-btn" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">Reset to 0</button>
            </div>

            ${buildNumberPadHtml({ nextLabel: 'Save ✓', allowMathOps: true })}
          </div>
        `, { maxWidth: 'max-w-sm' });

        document.getElementById('yzb-close-btn').addEventListener('click', closeModal);

        document.querySelectorAll('.yzb-mult-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const count = parseInt(btn.getAttribute('data-yzb-mult'), 10) || 0;
            closeModal();
            await updateYahtzeeCell(seatId, gameIdx, {
              yahtzeeBonusCount: count,
              yahtzeeBonusPoints: null,
            });
          });
        });

        document.getElementById('yzb-reset-btn').addEventListener('click', async () => {
          closeModal();
          await updateYahtzeeCell(seatId, gameIdx, {
            yahtzeeBonusCount: 0,
            yahtzeeBonusPoints: null,
          });
        });

        const saveBonus = async () => {
          const parsed = expr ? evaluateScoreExpression(expr) : 0;
          if (Number.isNaN(parsed) || parsed < 0) {
            showToast('Enter a valid non-negative bonus amount.', 'error');
            return;
          }
          closeModal();
          await updateYahtzeeCell(seatId, gameIdx, {
            yahtzeeBonusCount: bonusUnit > 0 ? Math.round(parsed / bonusUnit) : 0,
            yahtzeeBonusPoints: parsed,
          });
        };

        const handlePad = (key) => {
          if (key === 'NEXT') {
            saveBonus();
            return;
          }
          expr = applyNumberPadKey(expr, key);
          renderBonusModal();
        };

        document.querySelectorAll('.np-key').forEach((btn) => {
          btn.addEventListener('click', () => handlePad(btn.getAttribute('data-np')));
        });

        activeModalKeydownHandler = (e) => {
          if (/^[0-9]$/.test(e.key)) {
            e.preventDefault();
            handlePad(e.key);
          } else if (e.key === '+') {
            e.preventDefault();
            handlePad('+');
          } else if (e.key === '-') {
            e.preventDefault();
            handlePad('−');
          } else if (e.key === 'Backspace') {
            e.preventDefault();
            handlePad('BACK');
          } else if (e.key === 'Enter') {
            e.preventDefault();
            handlePad('NEXT');
          } else if (e.key === 'Escape') {
            closeModal();
          }
        };
        window.addEventListener('keydown', activeModalKeydownHandler);
      };

      renderBonusModal();
    }

          </div>

          <!-- Quick Invite Link Card -->
          <div class="p-3.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200/80 dark:border-indigo-800/70 flex items-center justify-between gap-3">
            <div class="min-w-0">
              <div class="text-xs font-extrabold text-indigo-900 dark:text-indigo-200">Invite Friends via Text</div>
              <div class="text-[11px] text-indigo-700/80 dark:text-indigo-300/80">Copies a direct link that opens Room ${escapeHtml(room.code)}</div>
            </div>
            <button id="set-copy-link-btn" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shrink-0 transition">
              Copy Link
            </button>
          </div>

          ${host ? `
            <!-- Room Name -->
            <div class="space-y-2">
              <label for="set-room-name-input" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Room Name</label>
              <div class="flex gap-2">
                <input
                  id="set-room-name-input"
                  type="text"
                  maxlength="28"
                  value="${escapeHtml(room.name || '')}"
                  placeholder="Room ${escapeHtml(room.code)}"
                  class="flex-1 min-w-0 px-3.5 py-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
                <button id="set-save-room-name-btn" class="px-4 py-2.5 rounded-2xl bg-slate-900 dark:bg-indigo-600 text-white font-bold text-xs shrink-0">
                  Save
                </button>
              </div>
            </div>

            <!-- Scoring Permissions -->
            <div class="space-y-2">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Who Can Log Scores?</label>
              <div class="grid grid-cols-2 gap-2">
                <button data-score-perm="anyone" class="set-perm-btn py-2.5 px-3 rounded-2xl border-2 text-xs font-bold transition ${
                  whoCanScore === 'anyone'
                    ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300'
                    : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
                }">
                  Anyone in Room
                </button>
                <button data-score-perm="host" class="set-perm-btn py-2.5 px-3 rounded-2xl border-2 text-xs font-bold transition ${
                  whoCanScore === 'host'
                    ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300'
                    : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
                }">
                  Host Only
                </button>
              </div>
            </div>

            <!-- Transfer Host -->
            <div class="space-y-2">
              <label for="set-host-select" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Room Host</label>
              <div class="flex gap-2">
                <select id="set-host-select" class="flex-1 px-3.5 py-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-semibold">
                  ${claimedPlayers.map((p) => `
                    <option value="${escapeHtml(p.claimedByUid)}" ${p.claimedByUid === room.hostUid ? 'selected' : ''}>
                      ${getAvatarObj(p.avatar).emoji} ${escapeHtml(p.name)} ${p.claimedByUid === room.hostUid ? '(Current Host)' : ''}
                    </option>
                  `).join('')}
                </select>
                <button id="set-transfer-host-btn" class="px-4 py-2.5 rounded-2xl bg-slate-900 dark:bg-indigo-600 text-white font-bold text-xs shrink-0">
                  Update
                </button>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-200 dark:border-slate-800">
              <button id="set-close-room-btn" class="w-full py-3 rounded-2xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800/80 hover:bg-rose-100 text-rose-600 dark:text-rose-400 font-extrabold text-sm transition">
                Close Room ${escapeHtml(room.code)}
              </button>
            </div>
          ` : `
            <div class="p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-xs text-slate-600 dark:text-slate-300">
              Only the room host can change room permissions, transfer hosting, or close the room.
            </div>
            <button id="set-leave-room-btn" class="w-full py-3 rounded-2xl bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 font-bold text-sm">
              Leave Room
            </button>
          `}

          <button id="set-done-btn" class="w-full py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 font-bold text-sm">Done</button>
        </div>
      `, { maxWidth: 'max-w-md' });

      document.getElementById('set-close-btn').addEventListener('click', closeModal);
      document.getElementById('set-done-btn').addEventListener('click', closeModal);

      document.getElementById('set-copy-link-btn').addEventListener('click', () => {
        handleQuickCopyAppLink(true);
      });

      const saveRoomNameBtn = document.getElementById('set-save-room-name-btn');
      if (saveRoomNameBtn) {
        saveRoomNameBtn.addEventListener('click', async () => {
          const inp = document.getElementById('set-room-name-input');
          const nextName = (inp ? inp.value : '').trim();
          const updated = JSON.parse(JSON.stringify(state.currentRoom));
          updated.name = nextName;
          await saveRoom(updated);
          showToast(nextName ? `Room renamed to "${nextName}"!` : `Room name reset to Room ${room.code}.`, 'success');
        });
      }

      document.querySelectorAll('.set-perm-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const perm = btn.getAttribute('data-score-perm');
          const updated = JSON.parse(JSON.stringify(state.currentRoom));
          updated.settings = { ...(updated.settings || {}), whoCanScore: perm };
          await saveRoom(updated);
          showToast(perm === 'host' ? 'Set to Host Only scoring.' : 'Anyone in the room can log scores.', 'success');
          openRoomSettingsModal();
        });
      });

      const transferBtn = document.getElementById('set-transfer-host-btn');
      if (transferBtn) {
        transferBtn.addEventListener('click', async () => {
          const sel = document.getElementById('set-host-select');
          if (!sel || !sel.value || sel.value === room.hostUid) return;
          const updated = JSON.parse(JSON.stringify(state.currentRoom));
          updated.hostUid = sel.value;
          await saveRoom(updated);
          closeModal();
          showToast('Room host transferred!', 'success');
        });
      }

      const closeRoomBtn = document.getElementById('set-close-room-btn');
      if (closeRoomBtn) {
        closeRoomBtn.addEventListener('click', () => openCloseRoomConfirmModal());
      }

      const leaveBtn = document.getElementById('set-leave-room-btn');
      if (leaveBtn) {
        leaveBtn.addEventListener('click', () => {
          closeModal();
          leaveRoomLocal();
        });
      }
    }

    // =========================================================================
    // 12. GLOBAL EVENT BINDINGS & URL INVITE AUTO-JOIN
    // =========================================================================
    function readInviteCodeFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        const code = (params.get('room') || '').replace(/\s+/g, '').toUpperCase();
        if (code.length === 4) {
          state.pendingInviteCode = code;
        }
      } catch {
        // Ignore URL parsing errors
      }
    }

    async function handlePendingInviteParam() {
      if (!state.pendingInviteCode) return;
      const code = state.pendingInviteCode;
      state.pendingInviteCode = null;
      const inp = document.getElementById('landing-room-code-input');
      if (inp) inp.value = code;
      await initiateJoinRoomFlow(code);
    }

    function bindGlobalEvents() {
  document.getElementById('header-copy-link-btn').addEventListener('click', () => {
    handleQuickCopyAppLink(true);
  });

  document.getElementById('header-players-btn').addEventListener('click', () => {
    if (state.currentRoom) openRoomSettingsModal();
  });

  document.getElementById('header-profile-btn').addEventListener('click', () => {
    openJoinOrCreateIdentityModal({ profileOnly: true });
  });

  document.getElementById('header-home-btn').addEventListener('click', () => {
    if (state.view !== 'landing') {
      leaveRoomLocal();
    }
  });

  // Clicking outside the modal closes it
  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modal-backdrop') {
      closeModal();
    }
  });

  // In-app Pull-to-Refresh for PWA & mobile browsers
  let pullStartY = 0;
  let isPulling = false;

  window.addEventListener('touchstart', (e) => {
    if (window.scrollY === 0 && state.currentRoomCode) {
      pullStartY = e.touches[0].clientY;
      isPulling = true;
    }
  }, { passive: true });

  window.addEventListener('touchend', async (e) => {
    if (!isPulling) return;
    isPulling = false;
    const pullDistance = e.changedTouches[0].clientY - pullStartY;
    if (pullDistance > 85 && window.scrollY === 0 && state.currentRoomCode) {
      await syncCurrentRoomNow({ silent: false });
    }
  }, { passive: true });
}

    // Bootstrap Application
    initTheme();
    readInviteCodeFromUrl();
    loadFullEmojiCatalog();
    bindGlobalEvents();
    initFirebase();
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
